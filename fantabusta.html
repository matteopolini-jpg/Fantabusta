<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1510">
<meta name="description" content="L'asta a buste chiuse dei 500 migliori giocatori d'Europa.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FantaBusta">
<title>FantaBusta – The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
/* FantaBusta — layout idea: one phone-width column, a night-match pitch behind a single
   paper "figurina" (the drawn player) and a kraft envelope for the sealed bid. */
:root {
  --night: #0b1510;
  --turf: #12241a;
  --turf-2: #183022;
  --line: rgba(236, 233, 220, 0.14);
  --chalk: #eeebdf;
  --muted: #98ab9e;
  --kraft: #dcbf86;
  --kraft-ink: #3b2a12;
  --wax: #c43a2c;
  --gold: #f0b443;
  --paper: #f6f1e2;
  --ink: #17140e;
  --ok: #4cc37a;
  --r-por: #f2a33a;
  --r-dif: #3fae68;
  --r-cen: #4a8cf3;
  --r-tre: #a874ef;
  --r-att: #ec4f4c;
  --display: 'Big Shoulders Display', 'Big Shoulders', 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  background-image:
    radial-gradient(120% 60% at 50% -10%, rgba(76, 195, 122, 0.10), transparent 60%),
    repeating-linear-gradient(180deg, rgba(255,255,255,0.018) 0 64px, transparent 64px 128px);
  color: var(--chalk);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { max-width: 520px; margin: 0 auto; padding: 14px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: 0.01em; line-height: 1; margin: 0; text-wrap: balance; text-transform: uppercase; }
h2 { font-size: 26px; }
h3 { font-size: 20px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.hidden { display: none !important; }
#app > section:empty, .stage > div:empty { display: none; }

/* ---------- masthead ---------- */
.mast { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.mast .logo { font-family: var(--display); font-weight: 900; font-size: 54px; line-height: 0.86; text-transform: uppercase; letter-spacing: -0.005em; }
.mast .logo span { color: var(--kraft); }
.mast .tag { color: var(--muted); font-size: 15px; }

/* ---------- panels & controls ---------- */
.panel { background: var(--turf); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 22px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.field { width: 100%; background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 17px; }
.field:focus { border-color: var(--kraft); outline: none; }
.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; font-size: 16px; background: var(--turf-2); color: var(--chalk); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--chalk); color: var(--ink); border-color: transparent; }
.btn.gold { background: var(--gold); color: var(--ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; color: #ff8f84; border-color: rgba(255, 120, 100, 0.35); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--night); border-radius: 10px; padding: 10px 6px; font-weight: 700; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--ink); border-color: transparent; }
.stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
.stepper button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--night); font-size: 24px; font-weight: 700; }
.stepper output { text-align: center; font-family: var(--display); font-size: 32px; font-weight: 800; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--night); border: 1px solid var(--line); }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.08em; color: var(--kraft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #3a4a40; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(76, 195, 122, 0.18); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--ink); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--turf-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.gold { color: var(--gold); }

/* ---------- formation picker ---------- */
.formations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fcard { border: 1px solid var(--line); border-radius: 12px; background: var(--night); padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.fcard[aria-pressed="true"] { border-color: var(--kraft); background: #1d2a20; box-shadow: inset 0 0 0 1px var(--kraft); }
.fcard .fname { font-family: var(--display); font-weight: 900; font-size: 24px; }
.mini-pitch { width: 100%; aspect-ratio: 3 / 3.6; border-radius: 6px; background: #1a5a35; position: relative; overflow: hidden; }
.mini-pitch::before { content: ""; position: absolute; inset: 6%; border: 1.5px solid rgba(255,255,255,0.35); border-radius: 2px; }
.mini-pitch i { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--paper); transform: translate(-50%, -50%); }

/* ---------- game header ---------- */
.ghead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ghead .left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ghead .round { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 0.9; text-transform: uppercase; }
.wallet { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.wallet .money { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 0.9; color: var(--gold); }
.wallet .money small { font-size: 18px; margin-left: 2px; }
.hostbadge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--kraft); }

/* ---------- figurina (drawn player) ---------- */
.stage { position: relative; display: flex; flex-direction: column; gap: 12px; }
.figurina {
  --role: var(--r-cen);
  background: var(--paper); color: var(--ink); border-radius: 14px; padding: 10px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.2);
  transform: rotate(-1.2deg);
}
.figurina .frame { border: 3px solid var(--role); border-radius: 9px; padding: 12px 14px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; position: relative; overflow: hidden; }
.figurina .frame::after { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: var(--role); opacity: 0.12; }
.figurina .club { grid-column: 1 / -1; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #5d5646; display: flex; gap: 6px; align-items: center; }
.figurina .pname { font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 0.9; text-transform: uppercase; letter-spacing: -0.005em; overflow-wrap: normal; word-break: normal; min-width: 0; overflow: hidden; padding-bottom: 2px; }
.figurina .pname.m { font-size: 40px; } .figurina .pname.s { font-size: 34px; } .figurina .pname.xs { font-size: 28px; }
.figurina .fullname { font-size: 14px; color: #5d5646; grid-column: 1 / -1; }
.figurina .shirt { grid-row: 2 / 4; grid-column: 2; align-self: center; width: 70px; height: 70px; }
.figurina .medal { grid-row: 2 / 4; grid-column: 2; align-self: center; width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 55%, #b37f16); color: var(--ink); display: grid; place-items: center; align-content: center; box-shadow: 0 4px 0 rgba(0,0,0,0.18), inset 0 0 0 3px rgba(255,255,255,0.35); }
.figurina .medal .mv { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 0.9; }
.figurina .medal .ml { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
.figurina .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; font-size: 14px; color: #3d382c; }
.roles { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.role { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 6px; border-radius: 6px; font-family: var(--display); font-weight: 900; font-size: 16px; color: #fff; letter-spacing: 0.02em; }
.role.Por { background: var(--r-por); }
.role.Dc, .role.Ds, .role.Dd { background: var(--r-dif); }
.role.E, .role.M, .role.C { background: var(--r-cen); }
.role.T, .role.W { background: var(--r-tre); }
.role.A, .role.Pc { background: var(--r-att); }
.role.g-por { background: var(--r-por); } .role.g-dif { background: var(--r-dif); } .role.g-cen { background: var(--r-cen); } .role.g-tre { background: var(--r-tre); } .role.g-att { background: var(--r-att); }
.leagues { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.lg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 10px 10px; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--night); text-align: left; font-weight: 700; font-size: 14px; }
.lg .lgn { line-height: 1.15; overflow-wrap: anywhere; }
.lg .lgc { font-size: 12px; color: var(--muted); font-weight: 600; }
.lg[aria-pressed="true"] { background: var(--chalk); color: var(--ink); border-color: transparent; }
.lg[aria-pressed="true"] .lgc { color: #5d5646; }
.figurina.enter { animation: deal 520ms cubic-bezier(.2,.9,.25,1.15) both; }
@keyframes deal { from { transform: translateY(-26px) rotate(-7deg) scale(0.94); opacity: 0; } to { transform: rotate(-1.2deg); opacity: 1; } }

/* ---------- countdown ---------- */
.clock { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.clock .secs { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 0.85; width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
.clock .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
.clock .bar i { display: block; height: 100%; width: 100%; background: var(--chalk); border-radius: inherit; transform-origin: left; }
.clock.hot .secs { color: #ff7a6b; }
.clock.hot .bar i { background: var(--wax); }

/* ---------- envelope (bid panel) ---------- */
.envelope {
  position: relative; background: var(--kraft); color: var(--kraft-ink); border-radius: 12px; padding: 22px 14px 14px;
  background-image: linear-gradient(160deg, rgba(255,255,255,0.18), transparent 40%), repeating-linear-gradient(45deg, rgba(0,0,0,0.025) 0 2px, transparent 2px 5px);
  box-shadow: 0 10px 28px rgba(0,0,0,0.35);
  display: flex; flex-direction: column; gap: 12px;
}
.envelope::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 18px; border-radius: 12px 12px 0 0; background: linear-gradient(170deg, rgba(0,0,0,0.12) 49.5%, transparent 50%) left / 50% 100% no-repeat, linear-gradient(190deg, rgba(0,0,0,0.12) 49.5%, transparent 50%) right / 50% 100% no-repeat; }
.envelope .elabel { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.amount { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; }
.amount button { min-height: 56px; border-radius: 12px; border: 2px solid rgba(59, 42, 18, 0.35); background: rgba(255,255,255,0.35); font-size: 28px; font-weight: 800; color: var(--kraft-ink); }
.amount .inwrap { position: relative; }
.amount input { width: 100%; text-align: center; font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 1; padding: 4px 34px 4px 8px; border-radius: 12px; border: 2px solid rgba(59, 42, 18, 0.35); background: rgba(255,255,255,0.55); color: var(--kraft-ink); font-variant-numeric: tabular-nums; }
.amount input:focus { outline: none; border-color: var(--kraft-ink); }
.amount .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-weight: 800; font-size: 15px; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.presets button { min-height: 40px; border-radius: 10px; border: 1px solid rgba(59, 42, 18, 0.3); background: rgba(255,255,255,0.3); font-weight: 800; color: var(--kraft-ink); font-variant-numeric: tabular-nums; }
.presets button:disabled { opacity: 0.35; }
.envelope .actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.btn.seal { background: var(--wax); color: #fff; border-color: transparent; font-size: 17px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
.btn.pass { background: transparent; color: var(--kraft-ink); border: 2px solid rgba(59, 42, 18, 0.35); }
.sealed { display: flex; align-items: center; gap: 14px; }
.waxseal { width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #e0584a, var(--wax) 55%, #8f2219); display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 900; font-size: 20px; box-shadow: 0 3px 0 rgba(0,0,0,0.25); flex: none; }
.sealed.enter .waxseal { animation: stamp 380ms cubic-bezier(.3,1.6,.4,1) both; }
@keyframes stamp { from { transform: scale(1.8) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
.note { border-radius: 12px; padding: 14px; background: var(--turf); border: 1px dashed var(--line); color: var(--muted); }

/* ---------- envelopes row ---------- */
.envs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.env { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 7px 10px 7px 7px; border-radius: 12px; background: var(--turf); border: 1px solid var(--line); font-size: 14px; font-weight: 700; }
.env .avatar { width: 28px; height: 28px; font-size: 14px; grid-row: 1 / 3; }
.env .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
.env .st { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.2; }
.env.sent { border-color: rgba(220, 191, 134, 0.55); }
.env.sent .st { color: var(--kraft); }
.env.off { opacity: 0.5; }

/* ---------- reveal ---------- */
.reveal { background: var(--turf); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.reveal .verdict { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 0.95; text-transform: uppercase; }
.reveal .verdict b { color: var(--gold); }
.bids { display: flex; flex-direction: column; gap: 6px; }
.bidrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--kraft); color: var(--kraft-ink); font-weight: 700; animation: open 380ms ease both; }
.bidrow:nth-child(2) { animation-delay: 90ms; } .bidrow:nth-child(3) { animation-delay: 180ms; } .bidrow:nth-child(4) { animation-delay: 270ms; } .bidrow:nth-child(n+5) { animation-delay: 340ms; }
.bidrow .amt { font-family: var(--display); font-weight: 900; font-size: 24px; font-variant-numeric: tabular-nums; }
.bidrow.win { background: var(--gold); }
@keyframes open { from { transform: rotateX(70deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- pitch (lineup) ---------- */
.pitch { position: relative; width: 100%; aspect-ratio: 3 / 3.75; border-radius: 12px; overflow: hidden;
  background: repeating-linear-gradient(180deg, #1c6139 0 12.5%, #1a5833 12.5% 25%); }
.pitch .lines { position: absolute; inset: 4%; border: 2px solid rgba(255,255,255,0.28); border-radius: 3px; }
.pitch .lines::before { content: ""; position: absolute; left: 50%; top: -2px; transform: translateX(-50%); width: 40%; height: 15%; border: 2px solid rgba(255,255,255,0.28); border-top: 0; }
.pitch .lines::after { content: ""; position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); width: 40%; height: 15%; border: 2px solid rgba(255,255,255,0.28); border-bottom: 0; }
.slot { position: absolute; transform: translate(-50%, -50%); width: 25%; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.slot .chip { width: 100%; padding: 4px 4px 3px; border-radius: 7px; background: var(--paper); color: var(--ink); font-weight: 700; font-size: 12.5px; line-height: 1.15; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
.slot .chip .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .chip .pr { display: block; font-size: 11px; color: #6b6352; font-variant-numeric: tabular-nums; }
.slot.empty .chip { background: rgba(0,0,0,0.28); color: rgba(255,255,255,0.75); border: 1.5px dashed rgba(255,255,255,0.45); box-shadow: none; }
.slot .lab { font-family: var(--display); font-weight: 800; font-size: 13px; color: rgba(255,255,255,0.85); letter-spacing: 0.04em; }
.slot.fresh .chip { animation: pop 600ms ease both; }
@keyframes pop { 0% { transform: scale(0.6); background: var(--gold); } 60% { transform: scale(1.08); } 100% { transform: none; } }

/* ---------- teams ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tabs button { flex: none; border: 1px solid var(--line); background: var(--night); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.tabs button[aria-pressed="true"] { background: var(--chalk); color: var(--ink); }
.teamline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.teamline .tn { font-family: var(--display); font-weight: 900; font-size: 24px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.log .lr { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.log .lr:last-child { border-bottom: 0; }

/* ---------- final ---------- */
.podium { display: flex; flex-direction: column; gap: 8px; }
.rank { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: var(--turf); border: 1px solid var(--line); }
.rank .pos { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; text-align: center; }
.rank .tot { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.rank .tot small { font-size: 14px; font-family: var(--body); font-weight: 600; color: var(--muted); margin-left: 3px; }
.rank.p1 { background: linear-gradient(135deg, #3b2f12, var(--turf) 70%); border-color: rgba(240, 180, 67, 0.6); }
.rank.p1 .pos, .rank.p1 .tot { color: var(--gold); }
.rank { animation: rise 520ms cubic-bezier(.2,.9,.3,1) both; }
.rank:nth-child(1) { animation-delay: 600ms; } .rank:nth-child(2) { animation-delay: 380ms; } .rank:nth-child(3) { animation-delay: 200ms; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.vtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.vtable td { padding: 7px 4px; border-bottom: 1px solid var(--line); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--chalk); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 50; max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

}
