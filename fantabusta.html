<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1fae55">
<meta name="description" content="L'asta a buste chiuse sui migliori calciatori d'Europa.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FantaBusta">
<title>FantaBusta – The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
/* FantaBusta — una domenica allo stadio. La pagina è il campo (strisce di erba tagliata);
   i numeri stanno sul tabellone (blu notte, cifre gialle a led); le cose di carta sono di carta:
   la figurina del giocatore e la busta gialla con il sigillo di ceralacca. */
:root {
  --grass-a: #1fae55;
  --grass-b: #189a49;
  --grass-deep: #0f7a37;
  --chalk: #ffffff;
  --navy: #0a1a44;
  --navy-2: #1b3274;
  --navy-3: #06102e;
  --ink: #0a1a44;
  --muted: #52618a;
  --soft: #eef2fa;
  --line: #d6dcec;
  --sun: #ffd60a;
  --sun-2: #c9a500;
  --red: #ef2b3c;
  --red-2: #a8121f;
  --manila: #f6cf7d;
  --manila-ink: #4a3410;
  --ok: #19b85a;
  --r-por: #ff9f1c;
  --r-dif: #17a957;
  --r-cen: #2f7bff;
  --r-tre: #9b5cff;
  --r-att: #ff3b4a;
  --display: 'Big Shoulders Display', 'Big Shoulders', 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  /* tasti in alto e chat */
  --tool-bg: #fff; --tool-bg-solid: #fff; --tool-ink: var(--navy); --tool-bd: 2px solid var(--navy); --tool-ring: var(--grass-a);
  --chat-bg: #fff; --chat-ink: var(--navy); --chat-acc: var(--navy); --chat-acc-ink: #fff; --chat-muted: var(--muted); --chat-line: var(--line); --chat-them: var(--soft); --chat-badge: var(--red); --chat-font: var(--body);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--grass-a);
  background-image:
    radial-gradient(130% 70% at 50% 0%, rgba(255, 255, 255, 0.10), transparent 60%),
    repeating-linear-gradient(180deg, var(--grass-a) 0 76px, var(--grass-b) 76px 152px);
  color: var(--chalk);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
#app { max-width: 520px; margin: 0 auto; padding: 8px 16px 56px; display: flex; flex-direction: column; gap: 16px; position: relative; }
h1, h2, h3 { font-family: var(--display); font-weight: 900; letter-spacing: 0.005em; line-height: 0.95; margin: 0; text-wrap: balance; text-transform: uppercase; }
h2 { font-size: 28px; }
h3 { font-size: 22px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14.5px; }
.tiny { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.gap6 { gap: 6px; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.center { text-align: center; }
.hidden { display: none !important; }
.warn-t { color: var(--red); }
#app > section:empty, .stage > div:empty { display: none; }

/* ---------- barra in alto ---------- */
.top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.top .link { color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; padding: 8px 0; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
.top-r { display: flex; align-items: center; gap: 10px; }
.top-t { font-weight: 700; font-size: 13.5px; color: rgba(255, 255, 255, 0.92); white-space: nowrap; }
.tool { box-shadow: 0 3px 0 var(--navy); }

/* ---------- testata: il cerchio di centrocampo dietro il nome ---------- */
.mast { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 0 6px; text-align: center; isolation: isolate; }
.mast::before { content: ""; position: absolute; z-index: -1; left: 50%; top: -31px; width: 160px; height: 160px; transform: translateX(-50%); border: 3px solid rgba(255, 255, 255, 0.6); border-radius: 50%; }
.mast::after { content: ""; position: absolute; z-index: -1; left: -40px; right: -40px; top: 47.5px; height: 3px; background: rgba(255, 255, 255, 0.6); }
.mast.final::before { top: -27px; } .mast.final::after { top: 51.5px; }
.mast .crest { width: 82px; height: 62px; filter: drop-shadow(0 4px 0 rgba(6, 16, 46, 0.35)); transform: rotate(-4deg); }
.mast .trophy { width: 70px; height: 70px; filter: drop-shadow(0 4px 0 rgba(6, 16, 46, 0.35)); }
.mast .logo { font-family: var(--display); font-weight: 900; font-size: 66px; line-height: 0.82; text-transform: uppercase; color: #fff; text-shadow: 3px 4px 0 var(--navy); letter-spacing: 0.01em; }
.mast .logo span { color: var(--sun); }
.mast .tag { color: #fff; font-size: 15.5px; font-weight: 600; max-width: 30ch; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
.mast.final .logo { font-size: 58px; }

/* ---------- pannelli bianchi appoggiati sull'erba ---------- */
.panel { background: #fff; color: var(--ink); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 0 var(--grass-deep); }
.panel h2 { font-size: 26px; color: var(--navy); }
.lbl { font-size: 14px; font-weight: 800; color: var(--navy); }
.field { width: 100%; background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 17px; min-height: 50px; }
.field:focus { border-color: var(--navy); outline: none; }
.field::placeholder { color: #8d97b3; }
.code-in { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; }
.btn { border-radius: 12px; padding: 11px 18px; font-weight: 800; font-size: 16px; background: #fff; color: var(--navy); border: 2px solid var(--navy); box-shadow: 0 4px 0 var(--navy); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; text-decoration: none; transition: transform 0.08s ease, box-shadow 0.08s ease; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--navy); color: #fff; box-shadow: 0 4px 0 var(--navy-3); border-color: var(--navy); }
.btn.gold { background: var(--sun); color: var(--navy); }
.btn.ghost { background: #fff; box-shadow: none; }
.btn.ghost:active:not(:disabled) { transform: none; background: var(--soft); }
.btn.danger { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 0 4px 0 var(--red); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 7px 12px; font-size: 14px; border-radius: 10px; box-shadow: 0 3px 0 var(--navy); }
.btn.sm.ghost { box-shadow: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { border: 2px solid var(--line); background: #fff; color: var(--navy); border-radius: 11px; padding: 9px 6px; font-weight: 800; min-height: 46px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--sun); border-color: var(--navy); }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
.stepper button { min-height: 50px; border-radius: 12px; border: 2px solid var(--navy); background: #fff; color: var(--navy); font-size: 26px; font-weight: 800; box-shadow: 0 3px 0 var(--navy); }
.stepper button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--navy); }
.stepper output { text-align: center; font-family: var(--display); font-size: 40px; font-weight: 900; color: var(--navy); line-height: 1; }

/* ---------- elenchi ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--soft); color: var(--ink); }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.08em; color: var(--navy); background: var(--sun); padding: 1px 8px 0; border-radius: 7px; line-height: 1.15; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #c3cadb; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(25, 184, 90, 0.2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 17px; color: var(--navy); flex: none; box-shadow: inset 0 0 0 2px rgba(10, 26, 68, 0.18); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 800; background: var(--soft); color: var(--navy); white-space: nowrap; }
.pill.gold { background: var(--sun); }
.item .pill { background: #fff; }
.x-btn { flex: 0 0 auto; width: 36px; height: 36px; margin-right: -4px; border: 0; border-radius: 10px; background: transparent; color: var(--muted, #5b6b8c); font: 400 24px/1 Figtree, sans-serif; cursor: pointer; }
.x-btn:hover { background: rgba(0, 0, 0, .06); }
.item.confirm { flex-wrap: wrap; box-shadow: inset 0 0 0 1.5px var(--red); }
.item.confirm .row { margin-left: auto; }
.leagues { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.lg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px 10px; min-height: 48px; border-radius: 11px; border: 2px solid var(--line); background: #fff; color: var(--navy); text-align: left; font-weight: 800; font-size: 14px; }
.lg .lgn { line-height: 1.15; overflow-wrap: anywhere; }
.lg .lgc { font-size: 12px; color: var(--muted); font-weight: 700; }
.lg[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.lg[aria-pressed="true"] .lgc { color: var(--sun); }

/* ---------- scelta del modulo ---------- */
.formations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fcard { border: 2px solid var(--line); border-radius: 13px; background: #fff; color: var(--navy); padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.fcard[aria-pressed="true"] { border-color: var(--navy); background: var(--sun); box-shadow: 0 4px 0 var(--navy); }
.fcard .fname { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1; }
.mini-pitch { width: 100%; aspect-ratio: 3 / 3.6; border-radius: 7px; background: repeating-linear-gradient(180deg, var(--grass-a) 0 16.6%, var(--grass-b) 16.6% 33.3%); position: relative; overflow: hidden; }
.mini-pitch::before { content: ""; position: absolute; inset: 6%; border: 1.5px solid rgba(255, 255, 255, 0.7); border-radius: 2px; }
.mini-pitch i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px var(--navy); transform: translate(-50%, -50%); }

/* ---------- il tabellone: giro, soldi, codice ---------- */
.ghead { display: flex; align-items: stretch; justify-content: space-between; gap: 12px; background: var(--navy); color: #fff; border-radius: 16px; padding: 10px 16px 12px; border: 3px solid var(--navy-2); box-shadow: 0 5px 0 var(--navy-3); }
.ghead .left { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
.cap { font-size: 12.5px; font-weight: 700; color: #b9c4e6; }
.led { font-family: var(--display); font-weight: 900; color: var(--sun); line-height: 0.9; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255, 214, 10, 0.45);
  -webkit-mask-image: radial-gradient(circle, #000 1.25px, rgba(0, 0, 0, 0.82) 1.6px); mask-image: radial-gradient(circle, #000 1.25px, rgba(0, 0, 0, 0.82) 1.6px); -webkit-mask-size: 3.5px 3.5px; mask-size: 3.5px 3.5px; }
.ghead .round { font-size: 52px; }
.ghead .bigcode { font-size: 48px; letter-spacing: 0.08em; }
.wallet { text-align: right; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; }
.wallet .money { font-size: 44px; }
.wallet .money small { font-size: 20px; margin-left: 3px; }
.wallet .pill { background: var(--navy-2); color: #fff; }

/* ---------- la figurina del giocatore estratto ---------- */
.stage { position: relative; display: flex; flex-direction: column; gap: 14px; }
.figurina {
  --role: var(--r-cen);
  background: #fff; color: var(--ink); border-radius: 16px; padding: 8px;
  box-shadow: 0 6px 0 rgba(6, 16, 46, 0.35), 0 18px 30px rgba(6, 16, 46, 0.25);
  transform: rotate(-1.4deg);
}
.figurina .frame { border-radius: 10px; padding: 0 14px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; position: relative; overflow: hidden; background: linear-gradient(160deg, #fff 55%, color-mix(in srgb, var(--role) 14%, #fff)); border: 3px solid var(--role); }
.figurina .club { grid-column: 1 / -1; margin: 0 -14px 4px; padding: 7px 14px 6px; background: var(--role); color: #fff; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; display: flex; gap: 6px; align-items: center; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
.figurina .pname { font-family: var(--display); font-weight: 900; font-size: 50px; line-height: 0.88; text-transform: uppercase; letter-spacing: 0; color: var(--navy); overflow-wrap: normal; word-break: normal; min-width: 0; overflow: hidden; padding-bottom: 2px; align-self: center; }
.figurina .pname.m { font-size: 43px; } .figurina .pname.s { font-size: 36px; } .figurina .pname.xs { font-size: 29px; }
.figurina .fullname { font-size: 14px; font-weight: 600; color: var(--muted); grid-column: 1 / -1; }
.figurina .shirt { grid-row: 2 / 4; grid-column: 2; align-self: center; width: 78px; height: 78px; filter: drop-shadow(0 3px 0 rgba(6, 16, 46, 0.25)); }
.figurina .medal { grid-row: 2 / 4; grid-column: 2; align-self: center; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1a8, var(--sun) 55%, var(--sun-2)); color: var(--navy); display: grid; place-items: center; align-content: center; box-shadow: 0 4px 0 var(--navy), inset 0 0 0 3px rgba(255, 255, 255, 0.5); border: 2px solid var(--navy); }
.figurina .medal .mv { font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 0.9; }
.figurina .medal .ml { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
.figurina .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--navy); }
.roles { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.role { display: inline-grid; place-items: center; min-width: 32px; height: 25px; padding: 0 6px; border-radius: 7px; font-family: var(--display); font-weight: 900; font-size: 16px; color: #fff; letter-spacing: 0.02em; }
.role.g-por { background: var(--r-por); } .role.g-dif { background: var(--r-dif); } .role.g-cen { background: var(--r-cen); } .role.g-tre { background: var(--r-tre); } .role.g-att { background: var(--r-att); }
.figurina.enter { animation: deal 560ms cubic-bezier(.2, .9, .25, 1.15) both; }
@keyframes deal { from { transform: translateY(-34px) rotate(-9deg) scale(0.92); opacity: 0; } to { transform: rotate(-1.4deg); opacity: 1; } }

/* ---------- il cronometro del tabellone ---------- */
.clock { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; background: var(--navy); border: 3px solid var(--navy-2); border-radius: 14px; padding: 8px 16px; box-shadow: 0 5px 0 var(--navy-3); }
.clock .secs { font-size: 50px; width: 2.1ch; text-align: right; }
.clock .bar { height: 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.clock .bar i { display: block; height: 100%; width: 100%; background: var(--sun); border-radius: inherit; transform-origin: left; }
.clock.hot { border-color: var(--red); }
.clock.hot .secs { color: #ff5a67; text-shadow: 0 0 12px rgba(239, 43, 60, 0.6); }
.clock.hot .bar i { background: var(--red); }

/* ---------- la busta (offerta) ---------- */
.envelope {
  position: relative; background: var(--manila); color: var(--manila-ink); border-radius: 14px; padding: 24px 14px 14px;
  background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.25), transparent 45%), repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.022) 0 2px, transparent 2px 5px);
  box-shadow: 0 6px 0 #b98e3d, 0 16px 28px rgba(6, 16, 46, 0.25);
  display: flex; flex-direction: column; gap: 12px;
}
.envelope::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 20px; border-radius: 14px 14px 0 0; background: linear-gradient(170deg, rgba(74, 52, 16, 0.16) 49.5%, transparent 50%) left / 50% 100% no-repeat, linear-gradient(190deg, rgba(74, 52, 16, 0.16) 49.5%, transparent 50%) right / 50% 100% no-repeat; }
.envelope .elabel { font-size: 14px; font-weight: 800; }
.amount { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; }
.amount button { min-height: 58px; border-radius: 12px; border: 2px solid var(--manila-ink); background: rgba(255, 255, 255, 0.45); font-size: 28px; font-weight: 800; color: var(--manila-ink); box-shadow: 0 3px 0 var(--manila-ink); }
.amount button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--manila-ink); }
.amount .inwrap { position: relative; }
.amount input { width: 100%; text-align: center; font-family: var(--display); font-weight: 900; font-size: 48px; line-height: 1; padding: 4px 34px 4px 8px; border-radius: 12px; border: 2px solid var(--manila-ink); background: #fffaf0; color: var(--manila-ink); font-variant-numeric: tabular-nums; min-height: 58px; }
.amount input:focus { outline: 3px solid var(--navy); outline-offset: 1px; }
.amount .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-weight: 800; font-size: 15px; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.presets button { min-height: 42px; border-radius: 10px; border: 1.5px solid rgba(74, 52, 16, 0.4); background: rgba(255, 255, 255, 0.4); font-weight: 800; color: var(--manila-ink); font-variant-numeric: tabular-nums; }
.presets button:disabled { opacity: 0.35; }
.envelope .actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.btn.seal { background: var(--red); color: #fff; border-color: var(--red-2); font-size: 17px; box-shadow: 0 4px 0 var(--red-2); }
.btn.pass { background: transparent; color: var(--manila-ink); border-color: var(--manila-ink); box-shadow: none; }
.sealed { display: flex; align-items: center; gap: 14px; }
.waxseal { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff6b72, var(--red) 55%, var(--red-2)); display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 900; font-size: 21px; box-shadow: 0 3px 0 rgba(74, 52, 16, 0.4); flex: none; }
.sealed.enter .waxseal { animation: stamp 380ms cubic-bezier(.3, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: scale(1.8) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
.note { border-radius: 14px; padding: 14px; background: rgba(255, 255, 255, 0.94); color: var(--navy); border: 2px dashed #9eacd2; }
.note.pause { display: flex; flex-direction: column; gap: 10px; border-style: solid; border-color: var(--sun); }

/* ---------- chi ha consegnato la busta ---------- */
.envs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.env { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 7px 10px 7px 7px; border-radius: 12px; background: rgba(255, 255, 255, 0.94); color: var(--navy); font-size: 14px; font-weight: 800; box-shadow: 0 3px 0 var(--grass-deep); }
.env .avatar { width: 30px; height: 30px; font-size: 14px; grid-row: 1 / 3; }
.env .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
.env .st { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.2; }
.env.sent { background: var(--sun); }
.env.sent .st { color: var(--navy); }
.env.off { opacity: 0.55; box-shadow: none; }

/* ---------- buste aperte ---------- */
.reveal { background: #fff; color: var(--navy); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 5px 0 var(--grass-deep); }
.reveal > .tiny { color: var(--muted); font-weight: 700; }
.reveal .verdict { font-family: var(--display); font-weight: 900; font-size: 32px; line-height: 0.98; text-transform: uppercase; }
.reveal .verdict b { background: var(--sun); padding: 0 5px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.reveal .tiny.muted { font-weight: 600; }
.bids { display: flex; flex-direction: column; gap: 6px; }
.bidrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--manila); color: var(--manila-ink); font-weight: 800; animation: open 380ms ease both; }
.bidrow:nth-child(2) { animation-delay: 90ms; } .bidrow:nth-child(3) { animation-delay: 180ms; } .bidrow:nth-child(4) { animation-delay: 270ms; } .bidrow:nth-child(n+5) { animation-delay: 340ms; }
.bidrow .amt { font-family: var(--display); font-weight: 900; font-size: 26px; font-variant-numeric: tabular-nums; }
.bidrow.win { background: var(--navy); color: var(--sun); }
@keyframes open { from { transform: rotateX(70deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- la formazione sul campo ---------- */
.pitch { position: relative; width: 100%; aspect-ratio: 3 / 3.75; border-radius: 12px; overflow: hidden; background: repeating-linear-gradient(180deg, var(--grass-a) 0 12.5%, var(--grass-b) 12.5% 25%); box-shadow: inset 0 0 0 2px rgba(10, 26, 68, 0.08); }
.pitch .lines { position: absolute; inset: 4%; border: 2.5px solid rgba(255, 255, 255, 0.75); border-radius: 3px; }
.pitch .lines::before { content: ""; position: absolute; left: 50%; top: -2.5px; transform: translateX(-50%); width: 40%; height: 15%; border: 2.5px solid rgba(255, 255, 255, 0.75); border-top: 0; }
.pitch .lines::after { content: ""; position: absolute; left: 50%; bottom: -2.5px; transform: translateX(-50%); width: 40%; height: 15%; border: 2.5px solid rgba(255, 255, 255, 0.75); border-bottom: 0; }
.slot { position: absolute; transform: translate(-50%, -50%); width: 25%; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.slot .chip { width: 100%; padding: 4px 4px 3px; border-radius: 8px; background: #fff; color: var(--navy); font-weight: 800; font-size: 12.5px; line-height: 1.15; box-shadow: 0 3px 0 rgba(6, 16, 46, 0.35); }
.slot .chip .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .chip .pr { display: block; font-size: 11px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.slot.empty .chip { background: rgba(6, 16, 46, 0.22); color: #fff; border: 1.5px dashed rgba(255, 255, 255, 0.85); box-shadow: none; }
.slot.empty .chip .pr { color: rgba(255, 255, 255, 0.85); }
.slot.fresh .chip { animation: pop 600ms ease both; }
@keyframes pop { 0% { transform: scale(0.6); background: var(--sun); } 60% { transform: scale(1.1); background: var(--sun); } 100% { transform: none; } }

/* ---------- squadre ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tabs button { flex: none; border: 2px solid var(--line); background: #fff; color: var(--navy); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; white-space: nowrap; }
.tabs button[aria-pressed="true"] { background: var(--navy); color: var(--sun); border-color: var(--navy); }
.teamline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.teamline .tn { font-family: var(--display); font-weight: 900; font-size: 26px; text-transform: uppercase; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- la cronaca, come la striscia delle notizie in tv ---------- */
.ticker { background: var(--navy); color: #fff; box-shadow: 0 5px 0 var(--navy-3); }
.ticker h3 { color: #fff; display: flex; align-items: center; gap: 10px; font-size: 21px; }
.ticker .live { font-family: var(--body); font-size: 12.5px; font-weight: 800; text-transform: none; letter-spacing: 0; background: var(--red); color: #fff; padding: 4px 9px 3px; border-radius: 6px; }
.log { display: flex; flex-direction: column; font-size: 14.5px; }
.log .lr { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 7px 0 7px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); position: relative; }
.log .lr::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); }
.log .lr:first-child::before { background: var(--sun); }
.log .lr:first-child b { color: var(--sun); }
.log .lr:last-child { border-bottom: 0; }
.log .muted, .ticker .muted { color: #aeb9dd; }

/* ---------- classifica finale ---------- */
.podium { display: flex; flex-direction: column; gap: 8px; }
.rank { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #fff; color: var(--navy); box-shadow: 0 5px 0 var(--grass-deep); }
.rank .pos { font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1; text-align: center; }
.rank .rn { font-weight: 800; font-size: 18px; }
.rank .tot { font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.rank .tot small { font-size: 14px; font-family: var(--body); font-weight: 700; color: var(--muted); margin-left: 3px; }
.rank.p1 { background: var(--sun); box-shadow: 0 5px 0 var(--navy); border: 2px solid var(--navy); }
.rank.p1 .muted, .rank.p1 .tot small { color: var(--navy); }
.rank { animation: rise 520ms cubic-bezier(.2, .9, .3, 1) both; }
.rank:nth-child(1) { animation-delay: 600ms; } .rank:nth-child(2) { animation-delay: 380ms; } .rank:nth-child(3) { animation-delay: 200ms; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.vtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.vtable td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.vtable td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vtable td.v { font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--navy); }
.vtable tr:last-child td { border-bottom: 0; }
.vtable tr:last-child td.v { background: var(--sun); border-radius: 6px; padding: 4px 8px; }

/* ---------- varie ---------- */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: 15px; box-shadow: 0 6px 0 var(--navy-3), 0 14px 30px rgba(6, 16, 46, 0.35); z-index: 60; max-width: calc(100% - 32px); }
.big-msg { padding: 10px 8px 40px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.big-msg h2 { color: #fff; text-shadow: 2px 3px 0 var(--navy); font-size: 32px; }
.big-msg p { color: #fff; font-weight: 600; max-width: 32ch; }
details.rules { background: #fff; color: var(--navy); border-radius: 16px; padding: 14px 16px; box-shadow: 0 5px 0 var(--grass-deep); }
details.rules summary { font-weight: 800; cursor: pointer; }
details.rules ol { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: #2c3a63; font-size: 15px; }
.overlay { position: fixed; inset: 0; background: rgba(6, 16, 46, 0.6); display: grid; place-items: end center; z-index: 40; padding: 16px; }
.sheet { width: 100%; max-width: 520px; background: #fff; color: var(--navy); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; margin-bottom: env(safe-area-inset-bottom); box-shadow: 0 6px 0 var(--navy); }
#app > .tiny.muted, #app > p.tiny { color: rgba(255, 255, 255, 0.88); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .figurina { transform: none; }
}
@media (max-width: 370px) {
  .mast .logo { font-size: 54px; }
  .figurina .pname { font-size: 40px; } .figurina .pname.m { font-size: 35px; } .figurina .pname.s { font-size: 30px; } .figurina .pname.xs { font-size: 25px; }
  .ghead .round { font-size: 44px; } .wallet .money { font-size: 38px; }
}

/* Valori Transfermarkt */
#h-vals h2 { margin-bottom: 4px; }
.tm-bar { height: 8px; border-radius: 99px; background: rgba(6, 16, 46, 0.12); overflow: hidden; margin: 12px 0 4px; }
.tm-bar i { display: block; height: 100%; background: var(--grass-a); border-radius: inherit; transition: width 0.3s ease; }
.note.warn { border-color: var(--red); border-style: solid; margin: 10px 0; padding: 10px 12px; }
#h-vals .btn.sm { margin: 0 0 10px; }
.ok-t { color: var(--grass-deep); font-weight: 800; }
.figurina .medal.tm .mv.long { font-size: 27px; }
.figurina .medal.tm .ml { font-size: 9.5px; letter-spacing: 0.04em; }
.rank.tm .tot { font-size: 30px; }
.rank.tm .tot small { display: block; text-align: right; margin: 2px 0 0; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .tm-bar i { transition: none; } }

/* ======================================================================
   Seconda mano: figurina con riflesso, buste che si aprono una alla volta,
   magliette sul campo, podio finale.
   ====================================================================== */
body { background-image:
    radial-gradient(90% 45% at 50% -8%, rgba(255, 255, 255, 0.20), transparent 62%),
    radial-gradient(120% 60% at 50% 110%, rgba(6, 16, 46, 0.28), transparent 60%),
    repeating-linear-gradient(180deg, var(--grass-a) 0 76px, var(--grass-b) 76px 152px); background-attachment: fixed, fixed, scroll; }

/* ---------- tabellone ---------- */
.ghead { position: relative; overflow: hidden; }
.ghead::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), transparent 42%); pointer-events: none; }
.ghead .round, .wallet .money { animation: ledin 320ms cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes ledin { from { transform: translateY(-7px) scale(1.12); opacity: 0.2; } to { transform: none; opacity: 1; } }

/* ---------- figurina ---------- */
.stage { perspective: 900px; }
.figurina .frame { isolation: isolate; }
.figurina .wm { position: absolute; z-index: -1; right: -4px; bottom: -38px; font-family: var(--display); font-weight: 900; font-size: 168px; line-height: 1; color: var(--role); opacity: 0.1; pointer-events: none; letter-spacing: -0.02em; }
.figurina .shine { position: absolute; inset: -20% -10%; z-index: 3; pointer-events: none; background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.85) 50%, transparent 58%); transform: translateX(-120%); }
.figurina.enter { animation: deal2 620ms cubic-bezier(.2, .85, .25, 1.1) both; transform-origin: 50% 60%; }
.figurina.enter .shine { animation: sweep 850ms ease-out 380ms both; }
.figurina.enter .shirt, .figurina.enter .medal { animation: plop 480ms cubic-bezier(.3, 1.5, .4, 1) 300ms both; }
@keyframes deal2 { 0% { transform: translateY(-46px) rotateX(64deg) rotate(-10deg) scale(0.86); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(-1.4deg); opacity: 1; } }
@keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
@keyframes plop { from { transform: scale(0.3) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
.figurina.t-gold { background: linear-gradient(135deg, #fff3b8, #e9bd2b 45%, #fff6c9 60%, #c99a12); box-shadow: 0 6px 0 rgba(6, 16, 46, 0.35), 0 18px 30px rgba(6, 16, 46, 0.25), 0 0 26px rgba(255, 214, 10, 0.55); }
.figurina.t-silver { background: linear-gradient(135deg, #ffffff, #b9c3d3 45%, #ffffff 60%, #8f9bb0); }
.figurina.t-bronze { background: linear-gradient(135deg, #ffe7d2, #cf8f5d 45%, #ffe9d6 60%, #a9683a); }
.figurina.t-gold .frame, .figurina.t-silver .frame, .figurina.t-bronze .frame { border-width: 2px; }
.figurina.t-gold .frame::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; mix-blend-mode: soft-light; opacity: 0.55;
  background: linear-gradient(115deg, transparent 20%, #7dd3fc 34%, #f0abfc 46%, #fde68a 58%, transparent 72%) 0 0 / 260% 100%; animation: holo 4.5s ease-in-out infinite alternate; }
@keyframes holo { from { background-position: 0 0; } to { background-position: 100% 0; } }

/* ---------- cronometro ---------- */
.ck-ic { display: none; }
.clock.hot { animation: beat 1s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: none; } 12% { transform: scale(1.025); } 24% { transform: none; } }
.clock .bar { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4); }
.clock .bar i { background: linear-gradient(90deg, #ffe45c, var(--sun)); }
.clock.hot .bar i { background: linear-gradient(90deg, #ff7a84, var(--red)); }

/* ---------- la busta: cursore e promemoria ---------- */
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: -2px 0; background: transparent; --fill: 0%; touch-action: pan-y; }
.range::-webkit-slider-runnable-track { height: 12px; border-radius: 999px; border: 2px solid var(--manila-ink); background: linear-gradient(90deg, var(--red) var(--fill), #fffaf0 var(--fill)); }
.range::-moz-range-track { height: 9px; border-radius: 999px; border: 2px solid var(--manila-ink); background: linear-gradient(90deg, var(--red) var(--fill), #fffaf0 var(--fill)); }
.range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff6b72, var(--red) 55%, var(--red-2)); border: 2px solid var(--manila-ink); box-shadow: 0 3px 0 rgba(74, 52, 16, 0.5); }
.range::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--red); border: 2px solid var(--manila-ink); box-shadow: 0 3px 0 rgba(74, 52, 16, 0.5); }
.range:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; border-radius: 999px; }
.bidhint { font-size: 13.5px; font-weight: 600; line-height: 1.3; min-height: 1.3em; margin-top: -4px; }
.bidhint b { font-variant-numeric: tabular-nums; }
.envelope.heavy .bidhint { color: var(--red-2); }
.envelope.heavy .amount input { border-color: var(--red-2); }
.btn.seal { position: relative; overflow: hidden; }
.btn.seal::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.35) 50%, transparent 60%); transform: translateX(-120%); animation: sweep 2.6s ease-in-out 1.2s infinite; }
.envelope.shut { padding-top: 46px; animation: shut 420ms cubic-bezier(.2, .9, .3, 1.15) both; }
.envelope.shut::before { height: 38px; background: linear-gradient(to bottom right, rgba(74, 52, 16, 0.2) 49.6%, transparent 50%) left / 50.2% 100% no-repeat, linear-gradient(to bottom left, rgba(74, 52, 16, 0.2) 49.6%, transparent 50%) right / 50.2% 100% no-repeat; }
.envelope.shut.passed { filter: saturate(0.35); }
.envelope.shut.passed .waxseal { background: #9aa3b5; }
@keyframes shut { from { transform: translateY(16px) scale(0.96); opacity: 0.4; } to { transform: none; opacity: 1; } }

/* ---------- chi ha consegnato ---------- */
.env { grid-template-columns: auto minmax(0, 1fr) auto; transition: background-color 0.25s ease; }
.ebadge { grid-row: 1 / 3; grid-column: 3; position: relative; width: 26px; height: 18px; border-radius: 3px; border: 1.5px solid currentColor; opacity: 0.28;
  background: linear-gradient(to bottom right, transparent 47%, currentColor 48%, currentColor 52%, transparent 53%) left top / 50% 62% no-repeat, linear-gradient(to bottom left, transparent 47%, currentColor 48%, currentColor 52%, transparent 53%) right top / 50% 62% no-repeat; }
.env.sent .ebadge { opacity: 1; background-color: var(--manila); animation: plop 420ms cubic-bezier(.3, 1.6, .4, 1) both; }
.env.sent .ebadge::after { content: ""; position: absolute; left: 50%; top: 52%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--red); box-shadow: 0 1px 0 var(--red-2); }
.env.sent { animation: envin 380ms ease-out both; }
@keyframes envin { 0% { transform: scale(0.96); } 55% { transform: scale(1.04); } 100% { transform: none; } }

/* ---------- buste aperte ---------- */
.reveal { position: relative; animation: revin 300ms ease-out both; }
@keyframes revin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.reveal.mine { box-shadow: 0 0 0 3px var(--sun), 0 6px 0 var(--sun-2); }
.reveal .bids { perspective: 600px; }
.reveal .bidrow { grid-template-columns: auto minmax(0, 1fr) auto; transform-origin: 50% 0; animation: open2 440ms cubic-bezier(.2, .9, .3, 1.15) var(--d, 0ms) both; }
.reveal .bidrow .avatar { width: 30px; height: 30px; font-size: 14px; }
.reveal .bidrow .bn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reveal .bidrow.win { background: var(--manila); color: var(--manila-ink); animation: open2 440ms cubic-bezier(.2, .9, .3, 1.15) var(--d, 0ms) both, crowned 520ms ease-out calc(var(--d, 0ms) + 400ms) both; }
@keyframes open2 { from { transform: rotateX(-88deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes crowned { 0% { background: var(--manila); color: var(--manila-ink); } 45% { background: var(--sun); color: var(--navy); transform: scale(1.045); } 100% { background: var(--navy); color: var(--sun); transform: none; } }
.vwrap { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.reveal .verdict { animation: verdict 460ms cubic-bezier(.2, 1.3, .4, 1) var(--d, 0ms) both; transform-origin: 0 50%; }
@keyframes verdict { from { transform: scale(1.18); opacity: 0; } to { transform: none; opacity: 1; } }
.stampmark { align-self: flex-end; margin-top: -4px; font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: 0.04em; color: var(--red); border: 3px solid var(--red); border-radius: 7px; padding: 5px 9px 3px; transform: rotate(-7deg); animation: stampin 380ms cubic-bezier(.3, 1.7, .4, 1) var(--d, 0ms) both;
  -webkit-mask-image: radial-gradient(circle at 30% 40%, #000 60%, rgba(0, 0, 0, 0.72) 61%); mask-image: radial-gradient(circle at 30% 40%, #000 60%, rgba(0, 0, 0, 0.72) 61%); }
.stampmark.mine { color: var(--grass-deep); border-color: var(--grass-deep); font-size: 26px; }
@keyframes stampin { from { transform: rotate(-22deg) scale(2.3); opacity: 0; } to { transform: rotate(-7deg); opacity: 1; } }
.burst { position: absolute; left: 50%; top: 45%; width: 0; height: 0; pointer-events: none; z-index: 5; }
.burst i { position: absolute; left: -4px; top: -6px; width: 8px; height: 12px; border-radius: 2px; background: var(--c); opacity: 0; animation: burst 950ms cubic-bezier(.1, .7, .3, 1) var(--d, 0ms) both; }
.burst.mine i { width: 10px; height: 14px; animation-duration: 1250ms; }
@keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(0.4); } 75% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(var(--r) * -1.7)) rotate(220deg); } }

/* ---------- il campo: magliette ---------- */
.tprog { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin-top: -4px; }
.tprog i { height: 6px; border-radius: 3px; background: var(--line); }
.tprog i.on { background: var(--grass-a); }
.pitch { background: radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(6, 16, 46, 0.22)), repeating-linear-gradient(180deg, var(--grass-a) 0 12.5%, var(--grass-b) 12.5% 25%); box-shadow: inset 0 0 0 2px rgba(10, 26, 68, 0.12), 0 4px 0 var(--grass-deep); }
.pitch .lines { background: linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)) center / 100% 2.5px no-repeat; }
.pitch .lines .mid { position: absolute; left: 50%; top: 50%; width: 27%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2.5px solid rgba(255, 255, 255, 0.75); border-radius: 50%; }
.slot .jersey { width: 34px; height: 30px; margin-bottom: -7px; position: relative; z-index: 1; fill: var(--jc); stroke: rgba(6, 16, 46, 0.55); stroke-width: 2.5; stroke-linejoin: round; filter: drop-shadow(0 2px 0 rgba(6, 16, 46, 0.3)); overflow: visible; }
.slot .jersey .jn { fill: none; stroke: rgba(255, 255, 255, 0.9); stroke-width: 3; }
.slot.empty .jersey { fill: rgba(255, 255, 255, 0.12); stroke: rgba(255, 255, 255, 0.8); stroke-dasharray: 4 3; stroke-width: 2; filter: none; }
.slot.empty .jersey .jn { stroke: none; }
.slot.empty .chip { padding: 2px 4px; border: 0; background: rgba(6, 16, 46, 0.3); border-radius: 999px; width: auto; min-width: 46px; }
.slot.empty .chip .pr { display: none; }
.slot .chip { position: relative; z-index: 2; }
.slot.fresh .jersey { animation: land 700ms cubic-bezier(.3, 1.4, .4, 1) both; }
.slot.fresh::before { content: ""; position: absolute; left: 50%; top: 40%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid var(--sun); animation: ring 900ms ease-out 250ms both; }
@keyframes land { 0% { transform: translateY(-46px) scale(1.6) rotate(-14deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
@keyframes ring { from { transform: scale(0.4); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }

/* ---------- cronaca ---------- */
.log .lr:first-child { animation: logn 420ms ease-out both; }
@keyframes logn { from { transform: translateX(-12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- finale: podio, classifica dal basso, coriandoli ---------- */
.mast.final .trophy { animation: trophy 1.4s cubic-bezier(.3, 1.5, .4, 1) 200ms both; }
@keyframes trophy { 0% { transform: translateY(-30px) scale(0.4) rotate(-20deg); opacity: 0; } 55% { transform: scale(1.15) rotate(6deg); opacity: 1; } 100% { transform: none; } }
#f-podium:empty, #f-rain:empty { display: none; }
#f-rain { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.stand3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px; padding: 4px 8px 0; margin-bottom: -6px; }
.stand3.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px 18% 0; }
.st { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; animation: stup 620ms cubic-bezier(.2, .9, .3, 1.2) var(--d, 0ms) both; }
@keyframes stup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.st .avatar { width: 46px; height: 46px; font-size: 21px; box-shadow: 0 0 0 3px #fff, 0 4px 0 rgba(6, 16, 46, 0.35); }
.st1 .avatar { width: 60px; height: 60px; font-size: 27px; box-shadow: 0 0 0 3px var(--sun), 0 4px 0 rgba(6, 16, 46, 0.35), 0 0 22px rgba(255, 214, 10, 0.7); }
.st .sn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; font-size: 14px; color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
.st .sb { width: 100%; height: 46px; border-radius: 10px 10px 0 0; background: linear-gradient(180deg, var(--navy-2), var(--navy)); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.14); }
.st2 .sb { height: 64px; } .st1 .sb { height: 88px; font-size: 44px; background: linear-gradient(180deg, #ffe45c, var(--sun)); color: var(--navy); }
.st .crown { position: absolute; top: -24px; left: 50%; width: 36px; margin-left: -18px; animation: crown 600ms cubic-bezier(.3, 1.6, .4, 1) calc(var(--d, 0ms) + 420ms) both; }
.st .crown svg { display: block; width: 100%; }
.st1 { padding-top: 22px; }
@keyframes crown { from { transform: translateY(-40px) rotate(-30deg); opacity: 0; } to { transform: rotate(-6deg); opacity: 1; } }
.podium .rank { animation: rise 520ms cubic-bezier(.2, .9, .3, 1) var(--d, 0ms) both; }
.podium .rank.p1 { animation: champ 700ms cubic-bezier(.2, 1.3, .4, 1) var(--d, 0ms) both; }
@keyframes champ { 0% { transform: scale(0.7); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: none; opacity: 1; } }
.rank.p1 { position: relative; overflow: hidden; }
.rank.p1::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.7) 50%, transparent 58%); transform: translateX(-120%); animation: sweep 1.1s ease-out calc(var(--d, 0ms) + 500ms) both; pointer-events: none; }
.rain { position: absolute; inset: 0; overflow: hidden; }
.rain i { position: absolute; top: -24px; left: var(--x); width: var(--w); height: calc(var(--w) * 1.7); border-radius: 2px; background: var(--c); opacity: 0; animation: rain var(--t) linear calc(var(--d, 0ms) + var(--l)) 2 both; }
.rain.mine i { animation-iteration-count: 4; }
@keyframes rain { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 1; transform: translateY(108vh) rotate(var(--s)); } }
@media (prefers-reduced-motion: reduce) { .rain, .burst, .figurina .shine { display: none; } }
.slot .chip .pr { white-space: nowrap; font-size: 10.5px; letter-spacing: -0.01em; }
.slot:not(.empty) .chip { padding: 3px 3px 2px; }
/* i due tasti della busta restano a portata di pollice anche se la busta esce dallo schermo */
.envelope .actions { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 6; }
.envelope .actions::before { content: ""; position: absolute; inset: -8px -8px -8px -8px; z-index: -1; border-radius: 14px; background: var(--manila); box-shadow: 0 -6px 12px rgba(246, 207, 125, 0.9); }
.presets button { min-height: 38px; }
.clock { padding: 4px 16px; }
.clock .secs { font-size: 42px; }
.ghead { padding: 6px 16px 8px; }
.ghead .round { font-size: 44px; } .wallet .money { font-size: 40px; }
#app[data-screen^="game"] { gap: 12px; }
.slot:not(.empty) .jersey { width: 38px; height: 33px; stroke: rgba(6, 16, 46, 0.8); }

</style>
