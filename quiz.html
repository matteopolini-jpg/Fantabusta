<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#120a3d">
<meta name="description" content="Quiz: sali la scala dei premi fino al milione o vinci la corsa dei cavalli, con domande dalle elementari alle superiori.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The PP Games">
<title>Quiz – The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&amp;family=Saira+Condensed:wght@600;700;800&amp;display=swap">
<style>
/* Quiz — uno studio televisivo di sera: fondo indaco con un faro dall'alto, risposte a esagono
   con le «rotaie» luminose, oro per i premi, arancio per la risposta bloccata, verde per quella giusta */
:root { --night: #120a3d; --stage: #1d1263; --panel-a: #2a1d86; --panel-b: #160d52; --rail: #8d85e6; --rail-hi: #d9d5ff;
  --ink: #f3f1ff; --muted: #b9b3ea; --line: rgba(196, 190, 255, .2); --gold: #ffc53d; --lock: #ff8c1a; --lock-ink: #2b1300;
  --ok: #2fdc7c; --ok-ink: #052614; --bad: #ff4d5e; --dark: #140c3f;
  --hex: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%);
  --hex-in: polygon(15px 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 15px 100%, 0 50%); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 400 16px/1.45 Saira, system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--night) radial-gradient(110% 55% at 50% -12%, rgba(130, 104, 255, .42), rgba(70, 46, 200, .12) 55%, transparent 75%) no-repeat; }
#app { max-width: 520px; margin: 0 auto; padding: 10px 16px calc(120px + env(safe-area-inset-bottom)); }
button { font-family: inherit; }
a { color: var(--ink); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
h1, h2, p { margin: 0; }
h1 { font: 800 34px/1.02 'Saira Condensed', Saira, sans-serif; letter-spacing: .005em; }
h2 { font: 700 21px/1.15 'Saira Condensed', Saira, sans-serif; letter-spacing: .01em; }
.small { font-size: 14px; } .tiny { font-size: 12.5px; } .muted { color: var(--muted); } .center { text-align: center; }
.blk { margin-top: 26px; } .field-row { margin: 18px 0; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.top-r { display: flex; align-items: center; gap: 10px; font: 700 14px 'Saira Condensed', Saira, sans-serif; color: var(--muted); }
.top-t { white-space: nowrap; font-size: 16px; color: var(--ink); }
.link { background: none; border: 0; padding: 8px 0; color: var(--ink); font: 600 15px Saira; text-decoration: none; cursor: pointer; }
.mast { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin: 14px 0 6px; }
.mast h1 { font-size: 56px; color: var(--gold); text-shadow: 0 0 28px rgba(255, 197, 61, .35); }
.lobby-mast { flex-direction: row; justify-content: space-between; align-items: flex-end; }
.lead { color: var(--muted); font-size: 15.5px; max-width: 34em; }
.hello { font-size: 15px; margin-top: 14px; }

/* il logo: quattro risposte in miniatura */
.logo { display: inline-grid; grid-template-columns: repeat(2, 50px); gap: 5px; }
.logo i { font: 800 13px/24px 'Saira Condensed', Saira, sans-serif; font-style: normal; color: var(--gold); padding-left: 11px; height: 24px; background: linear-gradient(var(--panel-a), var(--panel-b)); clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%); }
.logo i.lk { background: linear-gradient(#ffb24a, var(--lock)); color: var(--lock-ink); }
.logo i.ok { background: linear-gradient(#6ff5aa, #1fb862); color: var(--ok-ink); }
.hexcode { display: inline-block; font: 800 44px/1 'Saira Condensed', Saira, sans-serif; letter-spacing: .16em; padding: 10px 24px 10px 32px; color: var(--gold); background: linear-gradient(var(--panel-a), var(--panel-b)); clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 18px 100%, 0 50%); }
.bigcode { margin-top: 6px; }

/* moduli */
.lbl { display: block; font: 600 14.5px Saira; margin: 0 0 8px; }
.field { width: 100%; font: 500 17px Saira; padding: 11px 14px; border: 1.5px solid var(--rail); border-radius: 12px; background: rgba(0, 0, 0, .22); color: var(--ink); min-height: 48px; }
.field::placeholder { color: rgba(185, 179, 234, .7); }
.field:focus { outline: none; border-color: var(--gold); }
.code-in { max-width: 150px; text-transform: uppercase; letter-spacing: .2em; font-weight: 700; }
.seg { display: inline-flex; border: 1.5px solid var(--rail); border-radius: 12px; overflow: hidden; background: rgba(0, 0, 0, .18); max-width: 100%; }
.seg button { font: 600 14.5px Saira; color: var(--ink); background: transparent; border: 0; padding: 9px 13px; cursor: pointer; min-height: 42px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--gold); color: var(--dark); }
.seg.wrap4 button { padding: 9px 10px; font-size: 14px; }
.field-row .tiny { margin-top: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { --c: #fff; display: inline-flex; align-items: center; gap: 7px; font: 600 14px Saira; color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 13px 7px 10px; min-height: 40px; cursor: pointer; }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
.chip[aria-pressed=true] { background: var(--c); border-color: var(--c); color: var(--dark); }
.chip[aria-pressed=true]::before { background: var(--dark); }
.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--rail); background: transparent; color: var(--ink); font: 700 22px Saira; cursor: pointer; }
.stepper output { font: 800 30px 'Saira Condensed', Saira, sans-serif; min-width: 36px; text-align: center; color: var(--gold); }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; font: 700 16px Saira; border-radius: 12px; padding: 11px 18px; border: 1.5px solid var(--rail); background: transparent; color: var(--ink); text-decoration: none; cursor: pointer; min-height: 48px; white-space: nowrap; touch-action: manipulation; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--dark); box-shadow: 0 4px 0 #b9851a; }
.btn.primary:active { translate: 0 3px; box-shadow: 0 1px 0 #b9851a; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.danger { border-color: rgba(255, 77, 94, .55); color: #ffb9c0; }
.btn:disabled { opacity: .45; cursor: default; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.code-tag { font: 800 20px 'Saira Condensed', Saira, sans-serif; letter-spacing: .1em; color: var(--gold); }
.on { width: 9px; height: 9px; border-radius: 50%; background: rgba(243, 241, 255, .25); flex: 0 0 auto; }
.on.yes { background: var(--ok); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.pill { font: 600 12.5px Saira; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.count { font: 800 20px 'Saira Condensed', Saira, sans-serif; color: var(--muted); }
.who-dot { --c: #4d9bff; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: var(--dark); font: 700 10.5px Saira; flex: 0 0 auto; }
.teams { display: grid; gap: 12px; margin-top: 10px; }
.team { --c: #ff6161; border: 1.5px solid var(--line); border-left: 5px solid var(--c); border-radius: 12px; padding: 8px 12px; }
.team-h { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
.team-n { font: 800 19px 'Saira Condensed', Saira, sans-serif; color: var(--c); }
.team-chip { --c: #ff6161; display: inline-block; background: var(--c); color: var(--dark); font: 700 12px Saira; padding: 2px 9px; border-radius: 7px; white-space: nowrap; }
.team .item:last-child { border-bottom: 0; }
.shuffle { margin-top: 10px; }
.cat { --c: #fff; display: inline-block; font: 700 12.5px Saira; color: var(--dark); background: var(--c); padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.lvl { display: inline-block; font: 600 12px Saira; color: var(--muted); border: 1px solid var(--line); padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.pills .cat { padding: 3px 10px; }

/* ----- in partita ----- */
.hud { display: flex; align-items: center; gap: 14px; margin: 4px 0 8px; }
.clock { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.clock-t { font: 800 32px/1 'Saira Condensed', Saira, sans-serif; min-width: 1.6em; color: var(--gold); font-variant-numeric: tabular-nums; }
.clock-t.hot { color: var(--bad); }
.bar { flex: 1; height: 8px; background: rgba(255, 255, 255, .12); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe7a3); transform-origin: left center; border-radius: 99px; }
.bar i.hot { background: var(--bad); }
.hud-r { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.hud-r .tiny { color: var(--muted); }
.hud-v { font: 800 26px/1 'Saira Condensed', Saira, sans-serif; color: var(--gold); white-space: nowrap; }
.hud-v small { font-size: 16px; color: var(--muted); }
.strip { margin: 4px 0 12px; }
.strip-t { margin-top: 6px; }
.pips { display: flex; gap: 3px; align-items: center; }
.pips i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .14); }
.pips i.safe { height: 10px; }
.pips i.done { background: var(--gold); }
.pips i.cur { background: var(--lock); animation: blink 1s ease-in-out infinite alternate; }

.stage { position: relative; margin: 4px 0 14px; }
.qhead { display: flex; gap: 6px; justify-content: center; margin-bottom: 9px; min-height: 22px; }
.qbox { padding: 2px; background: linear-gradient(90deg, var(--rail), var(--rail-hi) 50%, var(--rail)); clip-path: polygon(22px 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 22px 100%, 0 50%); }
.qbox p { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 104px; padding: 16px 34px; font: 600 19px/1.32 Saira; background: radial-gradient(120% 140% at 50% 0%, #34259a, var(--panel-b) 70%); clip-path: polygon(21px 0, calc(100% - 21px) 0, 100% 50%, calc(100% - 21px) 100%, 21px 100%, 0 50%); overflow-wrap: anywhere; }
.stage.small .qbox p { min-height: 70px; font-size: 16.5px; padding: 12px 30px; }
.cover { position: absolute; left: 0; right: 0; bottom: 0; top: 31px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; opacity: 0; pointer-events: none; transform: scale(.96); }
.cover.show { opacity: 1; transform: none; transition: opacity .22s ease, transform .22s ease; }
.cv-n { font: 800 44px/1 'Saira Condensed', Saira, sans-serif; color: var(--gold); text-shadow: 0 0 30px rgba(255, 197, 61, .5); }
.cv-s { font: 700 19px 'Saira Condensed', Saira, sans-serif; color: var(--ink); }
#app.pre .opts, #app.pre .aids, #app.pre #q-aud, #app.pre .sticky { visibility: hidden; }
#app.pre .qbox p { color: transparent; }
.qbox p { transition: color .25s ease .05s; }
#app.pre .qbox p { transition: none; }

/* le risposte: barre a esagono con le rotaie che arrivano ai bordi */
.opts { display: flex; flex-direction: column; gap: 10px; margin: 0 0 12px; }
.orow { position: relative; }
.orow::before { content: ""; position: absolute; left: -16px; right: -16px; top: 50%; height: 2px; margin-top: -1px; background: linear-gradient(90deg, transparent, rgba(141, 133, 230, .7) 10%, rgba(141, 133, 230, .7) 90%, transparent); }
.opt { position: relative; display: block; width: 100%; padding: 2px; border: 0; cursor: pointer; color: var(--ink); text-align: left; background: linear-gradient(90deg, var(--rail), var(--rail-hi) 50%, var(--rail)); clip-path: var(--hex); touch-action: manipulation; }
.opt-in { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 9px 22px; background: linear-gradient(180deg, var(--panel-a) 0%, var(--panel-b) 58%, #1b1163 100%); clip-path: var(--hex-in); transition: background .15s ease; }
.opt .L { font: 800 19px/1 'Saira Condensed', Saira, sans-serif; color: var(--gold); flex: 0 0 auto; width: 16px; }
.opt .tx { font: 600 16.5px/1.22 Saira; overflow-wrap: anywhere; }
.opt:not(:disabled):active .opt-in { background: linear-gradient(180deg, #3a2aa6, #22177a); }
.opt:disabled { cursor: default; }
.opt.sel { background: linear-gradient(90deg, var(--gold), #fff2c4 50%, var(--gold)); }
.opt.sel .opt-in { background: linear-gradient(180deg, #45329f, #261a82); }
.opt.sel .L { color: #fff; }
.opt.lock { background: linear-gradient(90deg, #ffd39b, #fff1dc 50%, #ffd39b); }
.opt.lock .opt-in { background: linear-gradient(180deg, #ffb64f 0%, var(--lock) 55%, #ea7300 100%); }
.opt.lock .L, .opt.lock .tx { color: var(--lock-ink); }
.opt.gone { opacity: .32; }
.opt.gone .opt-in { background: var(--panel-b); }
.rev .opt.lock .opt-in { animation: suspense .55s ease-in-out infinite alternate; }
#app.shown .rev .opt.lock .opt-in { animation: none; }
#app.shown .opt.is-k { background: linear-gradient(90deg, #c8ffe0, #fff 50%, #c8ffe0); }
#app.shown .opt.is-k .opt-in { background: linear-gradient(180deg, #74f6ad 0%, #27c96d 55%, #15a557 100%); animation: flash .3s ease-in-out 3; }
#app.shown .opt.is-k .L, #app.shown .opt.is-k .tx { color: var(--ok-ink); }
#app.shown .opt.is-mine:not(.is-k) .opt-in { background: linear-gradient(180deg, #ff8a94, var(--bad) 60%, #d92c3f); }
#app.shown .opt.is-mine:not(.is-k) .L, #app.shown .opt.is-mine:not(.is-k) .tx { color: #fff; }
#app.shown .rev .orow:not(.r-k):not(.r-mine) { opacity: .45; }
@keyframes flash { 50% { filter: brightness(1.35); } }
@keyframes suspense { from { filter: brightness(1); } to { filter: brightness(1.22); } }
@keyframes blink { from { opacity: 1; } to { opacity: .45; } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }

/* aiuti */
.aids { min-height: 46px; }
.aid-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn.aid { min-height: 42px; border-radius: 999px; padding: 6px 15px; font: 700 15px Saira; }
.btn.aid.used { text-decoration: line-through; }
.btn.aid.ret { margin-left: auto; }
.btn.aid.ret.ask { background: var(--lock); border-color: var(--lock); color: var(--lock-ink); white-space: normal; text-align: center; }
.note { border-radius: 12px; padding: 11px 14px; background: rgba(0, 0, 0, .22); font-size: 15px; }
.aud { margin: 0 0 12px; padding: 10px 14px 8px; border-radius: 14px; background: rgba(0, 0, 0, .25); }
.aud-t { display: block; font: 700 14px 'Saira Condensed', Saira, sans-serif; color: var(--muted); margin-bottom: 4px; }
.aud-bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 110px; }
.ab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 0; }
.ab-v { font: 700 14px 'Saira Condensed', Saira, sans-serif; }
.ab-b { flex: 1; width: 28px; display: flex; align-items: flex-end; background: rgba(255, 255, 255, .07); border-radius: 6px 6px 0 0; overflow: hidden; }
.ab-b i { display: block; width: 100%; background: linear-gradient(var(--gold), #ff9a3c); border-radius: 6px 6px 0 0; transform-origin: bottom; animation: grow .9s ease-out; }
.ab b { font: 800 16px 'Saira Condensed', Saira, sans-serif; color: var(--gold); }
.ab.gone { opacity: .3; }
.others { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.oth { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: rgba(255, 255, 255, .07); font: 600 13px Saira; }
.oth .nm { max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oth .team-chip { margin-left: 3px; }
.oth b { font: 800 15px 'Saira Condensed', Saira, sans-serif; color: var(--muted); }
.oth.ok b { color: var(--ok); }
.oth.out { opacity: .42; }
.oth.off { opacity: .55; }
.sticky { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(18, 10, 61, 0), var(--night) 38%); display: flex; justify-content: center; z-index: 5; }
.sticky:empty { display: none; }
.btn.go { max-width: 488px; min-height: 56px; border: 0; border-radius: 14px; background: linear-gradient(#ffb64f, var(--lock)); color: var(--lock-ink); font: 800 21px 'Saira Condensed', Saira, sans-serif; letter-spacing: .02em; box-shadow: 0 4px 0 #a95000; }
.btn.go:active { translate: 0 3px; box-shadow: 0 1px 0 #a95000; }

/* la risposta giusta */
.verdict { text-align: center; margin: 4px 0 14px; min-height: 66px; }
.pre-v .v-t { color: var(--muted); animation: blink .5s ease-in-out infinite alternate; }
.post-v { display: none; }
#app.shown .pre-v { display: none; }
#app.shown .post-v { display: block; animation: pop .35s ease-out; }
.v-t { font: 800 32px/1.05 'Saira Condensed', Saira, sans-serif; }
.v-t.good { color: var(--ok); }
.v-t.bad { color: var(--bad); }
.v-t.win { color: var(--gold); font-size: 40px; text-shadow: 0 0 24px rgba(255, 197, 61, .55); }
.v-s { font-size: 15px; color: var(--muted); margin-top: 4px; }
.r-board { margin-top: 6px; }
.ladder { list-style: none; margin: 0; padding: 8px; border-radius: 16px; background: rgba(0, 0, 0, .26); }
.ladder li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; min-height: 27px; padding: 0 10px; border-radius: 7px; font: 700 16px/1 'Saira Condensed', Saira, sans-serif; color: var(--muted); }
.ladder li.safe { color: #fff; }
.ladder li.at { background: var(--lock); color: var(--lock-ink); }
.ladder .ln { text-align: right; opacity: .75; font-weight: 600; }
.ladder .amt { letter-spacing: .02em; }
.mks { display: flex; gap: 3px; justify-content: flex-end; flex-wrap: wrap; }
.mk-dot { --c: #fff; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: var(--dark); font: 700 9.5px Saira; flex: 0 0 auto; box-shadow: 0 0 0 2px rgba(18, 10, 61, .7); }
.m-old, .m-new { display: inline-flex; }
.m-new { display: none; }
#app.shown .m-new { display: inline-flex; animation: pop .45s ease-out .2s both; }
#app.shown .m-old { display: none; }

/* la pista: corsie d'erba, traguardo a scacchi */
.track { position: relative; border-radius: 14px; overflow: hidden; background: #166a39; padding: 3px 0; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .12); }
.lane { --c: #fff; position: relative; display: flex; align-items: center; height: 28px; background: repeating-linear-gradient(90deg, #1d8749 0 24px, #1a7c43 24px 48px); border-bottom: 1px dashed rgba(255, 255, 255, .4); }
.lane:last-child { border-bottom: 0; }
.lane.me { background: repeating-linear-gradient(90deg, #26a058 0 24px, #22944f 24px 48px); }
.track.big .lane { height: 44px; }
.lane .ln { flex: 0 0 74px; padding: 0 6px 0 9px; font: 600 12px/1.15 Saira; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: stretch; display: flex; align-items: center; background: rgba(0, 0, 0, .16); border-right: 2px solid rgba(255, 255, 255, .55); }
.run { position: relative; flex: 1; height: 100%; margin: 0 34px 0 4px; }
.run::after { content: ""; position: absolute; right: -8px; top: 0; bottom: 0; width: 8px; background: repeating-conic-gradient(#fff 0 25%, #1a1a1a 0 50%) 0 0 / 8px 8px; }
.horse { position: absolute; top: 50%; left: calc((100% - 34px) * var(--p0)); width: 34px; height: 26px; translate: 0 -50%; transition: left 1.5s cubic-bezier(.22, .8, .3, 1); }
#app.shown .horse { left: calc((100% - 34px) * var(--p1)); }
.hz { position: absolute; left: 0; bottom: 0; font-size: 23px; line-height: 1; transform: scaleX(-1); }
.track.big .horse { width: 42px; height: 36px; }
.track.big .hz { font-size: 32px; }
