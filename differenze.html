<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2a1d35">
<meta name="description" content="Trova le differenze: due disegni quasi uguali, vince chi trova prima le differenze.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The PP Games">
<title>Trova le differenze – The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Fredoka:wght@500;600;700&amp;display=swap">
<style>
/* Trova le differenze — due disegni come foto sul tavolo, sfondo prugna */
:root { --plum: #2a1d35; --plum-2: #3b2a4a; --cream: #f8f1ff; --muted: #c6b6d9; --lilac: #c9a7ff; --sun: #ffcf5c; --line: rgba(248, 241, 255, .15); --bad: #ff6b6b; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--plum); color: var(--cream); font: 400 16px/1.45 Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif; }
#app { max-width: 520px; margin: 0 auto; padding: 10px 16px calc(112px + env(safe-area-inset-bottom)); }
button { font-family: inherit; }
a { color: var(--cream); }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
h1, h2, p { margin: 0; }
h1 { font: 600 32px/1.05 Fredoka, Figtree, sans-serif; }
h2 { font: 600 22px/1.2 Fredoka, Figtree, sans-serif; }
.small { font-size: 14px; } .tiny { font-size: 12.5px; } .muted { color: var(--muted); } .center { text-align: center; }
.blk { margin-top: 26px; } .field-row { margin: 18px 0; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
.top-r { font: 700 13px Figtree; color: var(--muted); }
.link { background: none; border: 0; padding: 8px 0; color: var(--cream); font: 700 15px Figtree; text-decoration: none; cursor: pointer; }
.mast { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin: 12px 0 6px; }
.lobby-mast { flex-direction: row; justify-content: space-between; align-items: flex-end; }
.bigcode { font: 600 54px/1 Fredoka, Figtree, sans-serif; letter-spacing: .08em; }
.lead { color: var(--muted); font-size: 15px; max-width: 34em; }
.hello { font-size: 15px; margin-top: 14px; }
.logo { position: relative; display: inline-block; width: 64px; height: 48px; flex: 0 0 auto; }
.logo .ph { position: absolute; width: 44px; height: 31px; border-radius: 6px; border: 3px solid #fff; background: linear-gradient(#7cc8f0 56%, #74b85c 56%); box-shadow: 0 4px 10px rgba(0, 0, 0, .3); }
.logo .ph.a { left: 0; top: 0; rotate: -8deg; }
.logo .ph.b { right: 0; bottom: 0; rotate: 6deg; }
.logo .ph.b::after { content: ""; position: absolute; right: 5px; top: 3px; width: 9px; height: 9px; border-radius: 50%; background: #ffd34d; }

.lbl { display: block; font: 700 14px Figtree; margin: 0 0 8px; }
.field { width: 100%; font: 500 17px Figtree; padding: 11px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--plum-2); color: var(--cream); min-height: 48px; }
.field::placeholder { color: #9f8fb3; }
.field:focus { border-color: var(--lilac); outline: none; }
.code-in { max-width: 150px; text-transform: uppercase; letter-spacing: .2em; font: 600 22px Fredoka, Figtree, sans-serif; }
.seg { display: flex; border: 2px solid var(--lilac); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; font: 700 14.5px Figtree; color: var(--cream); background: transparent; border: 0; padding: 10px 4px; min-height: 44px; cursor: pointer; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--lilac); color: var(--plum); }
.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--lilac); background: transparent; color: var(--cream); font: 700 22px Figtree; cursor: pointer; }
.stepper output { font: 600 30px Fredoka, Figtree, sans-serif; min-width: 36px; text-align: center; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; font: 700 16px Figtree; border-radius: 12px; padding: 12px 18px; border: 2px solid var(--cream); background: transparent; color: var(--cream); text-decoration: none; cursor: pointer; min-height: 48px; }
.btn.primary { background: var(--sun); border-color: var(--sun); color: var(--plum); }
.btn.sm { padding: 5px 11px; min-height: 34px; font-size: 14px; border-width: 1.5px; border-radius: 9px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.code-tag { font: 600 20px Fredoka, Figtree, sans-serif; letter-spacing: .08em; }
.on { width: 9px; height: 9px; border-radius: 50%; background: rgba(248, 241, 255, .25); flex: 0 0 auto; }
.on.yes { background: #2ecc71; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.pill { font: 700 12.5px Figtree; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
.count { font: 600 20px Fredoka, Figtree, sans-serif; color: var(--muted); }
.who-dot { --c: #4d8dff; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #1b1324; font: 800 10.5px Figtree; flex: 0 0 auto; }
.teams { display: grid; gap: 10px; margin-top: 10px; }
.team { border: 2px solid var(--c); border-radius: 14px; padding: 8px 12px 4px; background: rgba(255, 255, 255, .04); }
.team-h { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
.team-n { font: 600 21px Fredoka, Figtree, sans-serif; color: var(--c); }
.team-chip { --c: #ff5a5f; display: inline-block; background: var(--c); color: #1b1324; font: 800 12px Figtree; padding: 3px 9px; border-radius: 7px; white-space: nowrap; }
.team .item:last-child { border-bottom: 0; }
.shuffle { margin-top: 12px; }

/* manche */
.hud { display: flex; align-items: flex-end; gap: 18px; margin: 2px 0 8px; }
.clock { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.clock-t { font: 600 38px/1 Fredoka, Figtree, sans-serif; }
.js-count.hot { color: var(--bad); }
.bar { display: block; height: 7px; border-radius: 4px; background: rgba(248, 241, 255, .15); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); transform-origin: left; }
.bar i.hot { background: var(--bad); }
.found { text-align: right; }
.found-n { display: block; font: 600 30px/1 Fredoka, Figtree, sans-serif; color: var(--sun); white-space: nowrap; }
.pics { position: relative; display: flex; flex-direction: column; gap: 10px; margin: 4px 0 10px; }
.pic { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), 0 12px 24px rgba(0, 0, 0, .35); touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: crosshair; }
.pic-svg { display: block; width: 100%; height: auto; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.overlay-svg { display: block; width: 100%; height: 100%; }
.ring { fill: none; stroke: var(--c); stroke-width: 3; }
.ring.pend { stroke: #fff; stroke-dasharray: 4 3; }
.ring.miss { stroke: #fff; stroke-width: 2.4; stroke-dasharray: 5 4; }
.ring-t { font: 800 8px Figtree, sans-serif; fill: #1b1324; }
.xmark path { stroke: #ff3b3b; stroke-width: 3.2; stroke-linecap: round; }
.cover { position: absolute; inset: -4px; border-radius: 16px; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .15s; }
.cover.show { opacity: 1; pointer-events: auto; }
.cover.wait, .cover.over { background: rgba(42, 29, 53, .94); }
.cover.lock { background: rgba(110, 18, 40, .55); }
#cover-t { font: 600 32px Fredoka, Figtree, sans-serif; color: #fff; text-align: center; padding: 0 16px; text-shadow: 0 2px 10px rgba(0, 0, 0, .4); }
.cover.wait #cover-t { font-size: 76px; color: var(--sun); }
.sbs { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.sb { display: inline-flex; align-items: center; gap: 6px; font: 600 20px Fredoka, Figtree, sans-serif; }
.sb.off { opacity: .45; }

/* risultati */
.rhead { margin: 6px 0 10px; }
.rhead p { margin-top: 6px; }
.legend { margin: -2px 0 0; }
.board-list { margin-top: 16px; }
.board-list ol { list-style: none; margin: 8px 0 0; padding: 0; }
.board-list li { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.board-list li.me .nm { font-weight: 800; }
.board-list .pos { font: 600 20px Fredoka, Figtree, sans-serif; width: 22px; text-align: center; color: var(--muted); }
.board-list .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-list .plus { font: 600 17px Fredoka, Figtree, sans-serif; color: var(--lilac); }
.board-list .tot { font: 600 26px Fredoka, Figtree, sans-serif; min-width: 44px; text-align: right; color: var(--sun); }
.winner { text-align: center; margin: 16px 0 4px; }
.win-name { font-size: 40px !important; margin: 4px 0; }
.win-pts { font: 600 22px Fredoka, Figtree, sans-serif; color: var(--sun); }
.htable-wrap { overflow-x: auto; margin-top: 8px; }
.htable { border-collapse: collapse; width: 100%; font-size: 15px; }
.htable th, .htable td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.htable td:first-child { text-align: left; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.htable td.tot { font: 600 18px Fredoka, Figtree, sans-serif; color: var(--sun); }
.htable tr.me td:first-child { font-weight: 800; }
.sticky { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(42, 29, 53, 0), var(--plum) 35%); display: flex; justify-content: center; z-index: 5; }
.sticky .btn { max-width: 488px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: 40px; }
.rules { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 10px; }
.rules summary { font: 800 16px Figtree; cursor: pointer; padding: 6px 0; }
.rules ol { padding-left: 20px; font-size: 14.5px; color: var(--muted); }
.rules li { margin: 7px 0; }
.overlay { position: fixed; inset: 0; background: rgba(10, 6, 14, .6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--plum-2); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin-bottom: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--cream); color: var(--plum); padding: 10px 16px; border-radius: 12px; font: 700 14px Figtree; max-width: 88vw; z-index: 30; text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .3); }
.toast.hidden { display: none; }
@media (prefers-reduced-motion: reduce) { .cover { transition: none; } }

/* tasti dei suoni e della chat */
:root { --tool-bg: var(--plum-2); --tool-bg-solid: var(--plum-2); --tool-ink: var(--cream); --tool-bd: 1px solid var(--line); --tool-ring: var(--plum);
  --chat-bg: #33243f; --chat-ink: var(--cream); --chat-acc: var(--lilac); --chat-acc-ink: var(--plum); --chat-muted: var(--muted); --chat-line: var(--line); --chat-them: rgba(255, 255, 255, .09); --chat-field: rgba(255, 255, 255, .06); --chat-badge: var(--bad); --chat-font: Figtree, system-ui, sans-serif; }
.top-r { display: flex; align-items: center; gap: 10px; }
.top-t { white-space: nowrap; }
.cover.wait #cover-t { white-space: pre-line; line-height: 1.05; }
.cover.wait #cover-t::first-line { font-size: 26px; color: #fff; }

</style>
</head>
<body>
<main id="app" data-screen=""><div class="msg"><p>Un attimo…</p></div></main>
<noscript><p style="padding:16px">Il gioco ha bisogno di JavaScript attivo.</p></noscript>
<script src="config.js"></script>
<script type="module" src="differenze.js?v=343cb28e"></script>
</body>
</html>
