<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fbfcf9">
<meta name="description" content="Nomi, cose, città: esce una lettera e ognuno, sul suo telefono, trova una parola per ogni categoria.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The PP Games">
<title>Nomi, cose, città – The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Kalam:wght@400;700&amp;display=swap">
<style>
/* Nomi, cose, città — il foglio a quadretti del gioco con carta e penna */
:root {
  --paper: #fbfcf9; --grid: #dce7f0; --margin: #ec9a9a;
  --ink: #2140a6; --ink-soft: rgba(33, 64, 166, .3); --red: #c8372a;
  --pencil: #5b6470; --text: #1f242b; --hi: #ffe86b; --rule: rgba(31, 36, 43, .17);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--text); background-color: var(--paper);
  font: 400 16px/1.45 Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-position: -1px -1px;
}
#app { max-width: 560px; margin: 0 auto; padding: 10px 16px calc(120px + env(safe-area-inset-bottom)) 46px; position: relative; min-height: 100vh; }
#app::before { content: ""; position: absolute; top: 0; bottom: 0; left: 30px; width: 2px; background: var(--margin); }
button { font-family: inherit; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.hand { font-family: Kalam, 'Comic Neue', cursive; }
h1, h2, p { margin: 0; }
h1.hand { font-weight: 700; font-size: 30px; line-height: 1.1; color: var(--ink); }
h2.hand { font-weight: 700; font-size: 22px; line-height: 1.2; color: var(--ink); }
.title { font-size: 34px !important; }
.lead { color: var(--pencil); font-size: 15px; margin-top: 6px; max-width: 34em; }
.small { font-size: 14px; } .tiny { font-size: 12.5px; } .muted { color: var(--pencil); }
.center { text-align: center; } .ink { color: var(--ink); } .red { color: var(--red); }
.big { font-size: 24px; font-weight: 700; color: var(--ink); }
.blk { margin-top: 26px; }
.field-row { margin: 18px 0; }
.row { display: flex; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }
.row.gap6 { gap: 6px; }
.center-row { justify-content: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.top { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
.top-r { font: 600 13px Figtree; color: var(--pencil); }
.link { background: none; border: 0; padding: 8px 0; color: var(--ink); font: 600 15px Figtree; text-decoration: none; cursor: pointer; }
.link.add { font-size: 14px; padding: 8px 0 0; }
.mast { display: flex; gap: 14px; align-items: center; margin: 10px 0 8px; }
.lobby-mast { justify-content: space-between; align-items: flex-end; }
.bigcode { font-size: 58px; line-height: 1; font-weight: 700; color: var(--ink); letter-spacing: .06em; }
.hello { font-size: 15px; margin-top: 10px; }

/* il cerchio a penna attorno alla lettera */
.ring { position: relative; width: 104px; height: 104px; flex: 0 0 auto; color: var(--red); }
.ring.sm { width: 70px; height: 70px; }
.ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring-svg path { fill: none; stroke: currentColor; stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
.ring-l { position: absolute; inset: 0; display: grid; place-items: center; font-family: Kalam, cursive; font-weight: 700; font-size: 58px; color: var(--ink); line-height: 1; padding-top: 8px; }
.ring.sm .ring-l { font-size: 38px; padding-top: 6px; }
.ring.draw .ring-svg path { stroke-dashoffset: 1; }
.ring.draw.landed .ring-svg path { transition: stroke-dashoffset .6s cubic-bezier(.6, .05, .3, 1); stroke-dashoffset: 0; }
.ring.spin .ring-svg { animation: turn 9s linear infinite; }
.ring.spin .ring-svg path { stroke-dasharray: .07 .035; }
@keyframes turn { to { transform: rotate(360deg); } }

/* campi */
.lbl { display: block; font: 700 14px Figtree; margin: 0 0 8px; }
.field { width: 100%; font: 500 17px Figtree; padding: 11px 14px; border: 2px solid var(--ink-soft); border-radius: 12px; background: #fff; color: var(--text); min-height: 48px; }
.field:focus { border-color: var(--ink); outline: none; }
.code-in { text-transform: uppercase; letter-spacing: .2em; font: 700 22px Kalam, cursive; max-width: 150px; padding-top: 9px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 15px Figtree; color: var(--text); background: rgba(255, 255, 255, .75); border: 1.5px solid var(--rule); border-radius: 8px; padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; }
.chip.own { border-style: dashed; }
.chip[aria-pressed=true] { background: var(--hi); border-color: transparent; font-weight: 700; transform: rotate(-.8deg); }
.chip .n { font: 700 14px Kalam, cursive; color: var(--red); }
.seg { display: flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: #fff; }
.seg button { flex: 1; font: 600 14.5px Figtree; color: var(--ink); background: transparent; border: 0; padding: 10px 4px; min-height: 44px; cursor: pointer; }
.seg button + button { border-left: 1.5px solid var(--ink-soft); }
.seg button[aria-pressed=true] { background: var(--ink); color: #fff; }
.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; color: var(--ink); font: 700 22px Figtree; cursor: pointer; }
.stepper output { font-size: 30px; font-weight: 700; color: var(--ink); min-width: 36px; text-align: center; }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; font: 700 16px Figtree; border-radius: 12px; padding: 12px 18px; border: 2px solid var(--ink); background: #fff; color: var(--ink); text-decoration: none; cursor: pointer; min-height: 48px; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.ghost { background: rgba(255, 255, 255, .6); }
.btn.sm { padding: 5px 11px; min-height: 34px; font-size: 14px; border-width: 1.5px; border-radius: 9px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn:disabled { opacity: .45; cursor: default; }

.list { display: flex; flex-direction: column; margin-bottom: 12px; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--rule); }
.item .grow { flex: 1; min-width: 0; }
.code-tag { font: 700 19px Kalam, cursive; color: var(--ink); letter-spacing: .08em; }
.on { width: 9px; height: 9px; border-radius: 50%; background: #c9ced4; flex: 0 0 auto; }
.on.yes { background: #1f8a5b; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.pill { font: 600 12.5px Figtree; color: var(--pencil); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; background: rgba(255, 255, 255, .8); }
.catlist { margin: 6px 0 0; padding-left: 26px; font: 400 21px/1.55 Kalam, cursive; color: var(--ink); }
.count { font-size: 21px; color: var(--ink); }
.who-dot { --c: #2a4fc4; display: inline-grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; border: 2px solid var(--c); color: var(--c); font: 800 10.5px Figtree; background: var(--paper); flex: 0 0 auto; }

/* scelta della lettera */
.pick { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 16px 0 6px; }
.letters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; margin: 10px 0; }
.letters button { aspect-ratio: 1; border: 1.5px solid var(--ink-soft); background: rgba(255, 255, 255, .85); border-radius: 8px; font-size: 26px; font-weight: 700; color: var(--ink); cursor: pointer; padding: 4px 0 0; }
.letters button.used { color: #b3b9c0; text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; cursor: default; }

/* manche in corso */
.playhead { display: flex; align-items: center; gap: 16px; margin: 6px 0 8px; }
.playhead .ring { width: 116px; height: 116px; }
.playhead .ring-l { font-size: 68px; }
.clock { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.clock-t { font-size: 42px; font-weight: 700; color: var(--ink); line-height: 1; }
.js-count.hot { color: var(--red); }
.pencil { display: block; height: 6px; border-radius: 3px; background: rgba(91, 100, 112, .15); overflow: hidden; }
.pencil i { display: block; height: 100%; background: var(--pencil); transform-origin: left; border-radius: 3px; }
.pencil i.hot { background: var(--red); }
.stopped { display: inline-block; margin: 2px 0 8px; padding: 6px 12px; background: var(--hi); font-weight: 600; transform: rotate(-.6deg); }
.sheet-rows { margin: 4px 0 0; }
.arow { display: grid; grid-template-columns: minmax(80px, 33%) 1fr 34px; align-items: end; gap: 8px; min-height: 56px; }
.cat { font: 600 13.5px/1.2 Figtree; color: var(--pencil); padding-bottom: 11px; overflow-wrap: anywhere; }
.ans { width: 100%; min-width: 0; border: 0; border-bottom: 2px solid var(--ink-soft); border-radius: 0; background: transparent; font-size: 25px; color: var(--ink); padding: 8px 2px 1px; outline: none; }
.ans:focus { border-bottom-color: var(--ink); background: linear-gradient(transparent 62%, rgba(255, 232, 107, .6) 62%); }
.ans:disabled { -webkit-text-fill-color: var(--ink); opacity: 1; border-bottom-style: dashed; }
.mark { font: 700 19px Kalam, cursive; padding-bottom: 7px; text-align: center; }
.mark .ok { color: var(--ink); } .mark .no { color: var(--red); font-size: 15px; }
.stopbar { margin: 24px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.stamp { font: 700 34px/1 Kalam, cursive; letter-spacing: .04em; color: var(--red); background: transparent; border: 4px solid var(--red); border-radius: 12px; padding: 13px 30px 7px; transform: rotate(-4deg); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--red); cursor: pointer; }
.stamp:disabled { color: #b9bec5; border-color: #c9ced4; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px #c9ced4; cursor: default; }
.stamp:not(:disabled):active { transform: rotate(-4deg) scale(.96); }
.prog { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pg { display: inline-flex; align-items: center; gap: 5px; font-size: 18px; color: var(--ink); }
.pg.off { opacity: .45; }

/* controllo delle risposte */
.rhead { display: flex; gap: 14px; align-items: center; margin: 6px 0 4px; }
.rhead p { margin-top: 4px; }
.rcat { margin-top: 22px; }
.rcat h2 { border-bottom: 2px solid var(--ink-soft); padding-bottom: 2px; }
.rrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.rmid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ans-t { font-size: 22px; color: var(--ink); line-height: 1.15; overflow-wrap: anywhere; }
.rrow.mine .ans-t { background: linear-gradient(transparent 60%, rgba(255, 232, 107, .65) 60%); align-self: flex-start; }
.rrow.k-x .ans-t, .rrow.k-l .ans-t { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: #7c88aa; }
.tag { font: 600 12px Figtree; color: var(--pencil); }
.pts { font-size: 24px; font-weight: 700; color: var(--red); min-width: 34px; text-align: right; }
.rrow.k-U .pts, .rrow.k-S .pts { text-decoration: underline double; text-underline-offset: 3px; }
.veto, .veto-sp { width: 82px; flex: 0 0 auto; }
.veto { font: 600 13px Figtree; color: var(--red); background: rgba(255, 255, 255, .7); border: 1.5px solid rgba(200, 55, 42, .5); border-radius: 8px; padding: 6px 4px; min-height: 36px; cursor: pointer; }
.veto[aria-pressed=true] { background: var(--red); color: #fff; border-color: var(--red); }
.readyrow { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sticky { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(251, 252, 249, 0), var(--paper) 35%); display: flex; justify-content: center; z-index: 5; }
.sticky .btn { max-width: 528px; }

/* classifiche */
.board { margin-top: 22px; }
.board ol { list-style: none; margin: 8px 0 0; padding: 0; }
.board li { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.board li.me .nm { font-weight: 800; }
.board .pos { font-size: 20px; color: var(--pencil); width: 22px; text-align: center; }
.board .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .plus { color: var(--red); font-size: 18px; }
.board .tot { font-size: 25px; font-weight: 700; color: var(--ink); min-width: 46px; text-align: right; }
.board ol li:last-child { border-bottom: 3px double var(--ink-soft); }
.lastr { margin-top: 14px; }
.lastr summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 8px 0; }
.lr-cat { padding: 6px 0 10px; border-bottom: 1px dashed var(--rule); }
.lr-h { display: block; font: 700 13px Figtree; color: var(--pencil); margin-bottom: 4px; }
.lr-a { display: inline-flex; align-items: center; gap: 5px; margin: 3px 12px 3px 0; font-size: 18px; color: var(--ink); }
.lr-a b { font-size: 16px; }
.lr-a.k-x .hand, .lr-a.k-l .hand { text-decoration: line-through; text-decoration-color: var(--red); }
.winner { margin: 18px 0 4px; text-align: center; }
.win-name { font-size: 42px !important; margin: 2px 0; }
.win-pts { font-size: 24px; font-weight: 700; }
.htable-wrap { overflow-x: auto; margin-top: 8px; }
.htable { border-collapse: collapse; width: 100%; font-size: 14px; }
.htable th, .htable td { padding: 6px; border-bottom: 1px dashed var(--rule); text-align: center; white-space: nowrap; }
.htable td:first-child { text-align: left; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
.htable th.hand { font-size: 21px; color: var(--ink); }
.htable td.hand { font-size: 18px; color: var(--ink); }
.htable td.red { color: var(--red); font-weight: 700; }
.htable tr.me td:first-child { font-weight: 800; }

.msg { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: 40px; }
.rules { margin-top: 32px; border-top: 1px dashed var(--rule); padding-top: 10px; }
.rules summary { font: 700 16px Figtree; color: var(--ink); cursor: pointer; padding: 6px 0; }
.rules ol { padding-left: 20px; font-size: 14.5px; }
.rules li { margin: 7px 0; }
.overlay { position: fixed; inset: 0; background: rgba(20, 24, 30, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--paper); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin-bottom: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 16px; border-radius: 12px; font: 600 14px Figtree; max-width: 88vw; z-index: 30; text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
.toast.hidden { display: none; }
@media (prefers-reduced-motion: reduce) {
  .ring.spin .ring-svg { animation: none; }
  .ring.draw .ring-svg path { stroke-dashoffset: 0; transition: none; }
}
.more { margin-top: 10px; }
.more summary { cursor: pointer; font: 600 14px Figtree; color: var(--ink); padding: 6px 0; }
.more .chips { margin-top: 8px; }
.row.wrap { flex-wrap: wrap; }
.addrow { gap: 4px 18px; }

/* tasti dei suoni e della chat */
:root { --tool-bg: #fff; --tool-bg-solid: #fff; --tool-ink: var(--ink); --tool-bd: 1.5px solid var(--ink-soft); --tool-ring: var(--paper);
  --chat-bg: var(--paper); --chat-ink: var(--text); --chat-acc: var(--ink); --chat-acc-ink: #fff; --chat-muted: var(--pencil); --chat-line: var(--rule); --chat-them: #e9f0f7; --chat-badge: var(--red); --chat-font: Figtree, system-ui, sans-serif; }
.top-r { display: flex; align-items: center; gap: 10px; }
.top-t { white-space: nowrap; }

</style>
</head>
<body>
<main id="app" data-screen=""><div class="msg"><p>Un attimo…</p></div></main>
<noscript><p style="padding:16px">Il gioco ha bisogno di JavaScript attivo.</p></noscript>
<script src="config.js"></script>
<script type="module" src="nomicose.js?v=2940ba55"></script>
</body>
</html>
