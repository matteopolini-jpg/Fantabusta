<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f2730">
<meta name="description" content="Il Duello: una definizione, la parola che si scopre lettera per lettera e il tuo cronometro che scorre. Chi resta senza tempo è fuori.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The PP Games">
<title>Il Duello – The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Anton&amp;display=swap">
<style>
/* Il Duello — studio televisivo di sera: fondale petrolio, caselle color carta, cronometri color corallo. */
:root { --bg: #0f2730; --bg-2: #16343f; --panel: #1b3f4c; --line: rgba(251, 243, 224, .16); --ink: #fbf3e0; --muted: #9db6bd; --paper: #fbf3e0; --paper-ink: #0c1f27;
  --coral: #ff6b4a; --coral-d: #c9462a; --gold: #ffc857; --ok: #3ddc97; --ok-d: #1f9c66;
  --tool-bg: #1b3f4c; --tool-bg-solid: #1b3f4c; --tool-ink: var(--ink); --tool-bd: 1.5px solid var(--line); --tool-ring: var(--bg);
  --chat-bg: #fbf3e0; --chat-ink: #0c1f27; --chat-acc: #ff6b4a; --chat-acc-ink: #fff; --chat-muted: #5b7078; --chat-line: rgba(12, 31, 39, .12); --chat-them: #efe5cc; --chat-field: #fff; --chat-badge: #ff6b4a; --chat-font: 'DM Sans', system-ui, sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 400 16px/1.45 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: radial-gradient(120% 60% at 50% -10%, #23505f 0%, transparent 60%), radial-gradient(80% 40% at 50% 105%, #0a1b21 0%, transparent 70%), var(--bg); background-attachment: fixed; }
#app { max-width: 520px; margin: 0 auto; padding: 8px 16px calc(56px + env(safe-area-inset-bottom)); }
button, input { font-family: inherit; }
a { color: var(--ink); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
h1, h2, p { margin: 0; }
h1 { font: 400 44px/1 Anton, 'DM Sans', sans-serif; letter-spacing: .01em; text-transform: uppercase; }
h2 { font: 700 19px/1.15 'DM Sans', sans-serif; }
.small { font-size: 14.5px; } .tiny { font-size: 12.5px; } .muted { color: var(--muted); } .center { text-align: center; } .warn { color: var(--gold); }
.blk { margin-top: 24px; } .field-row { margin: 18px 0; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; min-height: 46px; }
.top-r { display: flex; align-items: center; gap: 10px; }
.top-t { font: 600 14px 'DM Sans', sans-serif; color: var(--muted); white-space: nowrap; }
.link { background: none; border: 0; padding: 8px 0; color: var(--ink); font: 600 15px 'DM Sans', sans-serif; text-decoration: none; cursor: pointer; }
.mast { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin: 14px 0 6px; }
.mast h1 { font-size: 64px; color: var(--paper); text-shadow: 0 4px 0 var(--coral-d); }
.lobby-mast { flex-direction: row; justify-content: space-between; align-items: flex-end; }
.lead { color: var(--muted); font-size: 16px; max-width: 34em; }
.hello { font-size: 15px; margin-top: 14px; }
.logo { display: inline-block; width: 58px; height: 58px; } .logo svg { display: block; width: 100%; height: 100%; }
.bigcode { font: 400 52px/1 Anton, sans-serif; letter-spacing: .12em; color: var(--gold); margin-top: 4px; }
.lbl { display: block; font: 600 14.5px 'DM Sans', sans-serif; margin: 0 0 8px; }
.field { width: 100%; font: 500 18px 'DM Sans', sans-serif; padding: 11px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--paper-ink); min-height: 50px; }
.field:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 200, 87, .35); }
.code-in { max-width: 150px; text-transform: uppercase; letter-spacing: .2em; font-weight: 700; }
.seg { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: rgba(255, 255, 255, .04); max-width: 100%; }
.seg button { font: 600 15px 'DM Sans', sans-serif; color: var(--ink); background: transparent; border: 0; padding: 9px 13px; cursor: pointer; min-height: 44px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--paper); color: var(--paper-ink); }
.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: var(--ink); font: 700 22px 'DM Sans', sans-serif; cursor: pointer; }
.stepper output { font: 400 32px Anton, sans-serif; min-width: 36px; text-align: center; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; font: 700 16px 'DM Sans', sans-serif; border-radius: 12px; padding: 11px 18px; border: 2px solid var(--line); background: rgba(255, 255, 255, .05); color: var(--ink); text-decoration: none; cursor: pointer; min-height: 48px; white-space: nowrap; touch-action: manipulation; }
.btn.primary { background: var(--coral); border-color: var(--coral-d); color: #fff; box-shadow: 0 4px 0 var(--coral-d); }
.btn.primary:active { translate: 0 3px; box-shadow: 0 1px 0 var(--coral-d); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; border-width: 1.5px; }
.btn.danger { border-color: #ff8f7a; color: #ffb3a3; }
.btn:disabled { opacity: .45; cursor: default; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.code-tag { font: 400 21px Anton, sans-serif; letter-spacing: .1em; color: var(--gold); }
.on { width: 9px; height: 9px; border-radius: 50%; background: rgba(251, 243, 224, .22); flex: 0 0 auto; }
.on.yes { background: var(--ok); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.pill { font: 600 12.5px 'DM Sans', sans-serif; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.count { font: 400 21px Anton, sans-serif; color: var(--muted); }
.who-dot { --c: #5aa9ff; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #0c1f27; font: 700 10.5px 'DM Sans', sans-serif; flex: 0 0 auto; }
.msg { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: 40px; }
.rules { margin-top: 32px; border-top: 2px solid var(--line); padding-top: 10px; }
.rules summary { font: 700 17px 'DM Sans', sans-serif; cursor: pointer; padding: 6px 0; }
.rules ol { padding-left: 20px; font-size: 15px; color: var(--muted); }
.rules li { margin: 7px 0; } .rules b { color: var(--ink); }
.overlay { position: fixed; inset: 0; background: rgba(5, 14, 18, .7); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--bg-2); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin-bottom: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--paper); color: var(--paper-ink); padding: 10px 16px; border-radius: 10px; font: 600 14px 'DM Sans', sans-serif; max-width: 88vw; z-index: 30; text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
.toast.hidden { display: none; }

/* ---------- i cronometri di tutti ---------- */
.clocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; margin-top: 4px; }
.ck { --c: var(--coral); position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 7px; align-items: center; padding: 6px 8px; border-radius: 12px; background: var(--panel); border: 2px solid transparent; }
.ck .who-dot { grid-row: 1 / 3; width: 30px; height: 30px; font-size: 11.5px; }
.ck-n { font: 600 13px/1.15 'DM Sans', sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ck-t { grid-column: 2; font: 400 19px/1 Anton, sans-serif; letter-spacing: .03em; font-variant-numeric: tabular-nums; color: var(--paper); }
.ck-s { grid-row: 1 / 3; grid-column: 3; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: rgba(251, 243, 224, .1); color: var(--muted); font: 700 12px/22px 'DM Sans', sans-serif; text-align: center; }
.ck.me .ck-n { color: var(--gold); }
.ck.act { border-color: var(--c); background: #22505f; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 28%, transparent); }
.ck.act .ck-t { color: var(--c); }
.ck.dead { opacity: .45; } .ck.dead .ck-t { font: 600 13px 'DM Sans', sans-serif; color: var(--muted); letter-spacing: 0; }
.ck.dead .ck-n { text-decoration: line-through; }
.ck.off .who-dot { filter: grayscale(1); opacity: .6; }

/* ---------- il palco ---------- */
.stagebox { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.big { --c: var(--coral); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 2px 12px; padding: 10px 14px 12px; border-radius: 16px; background: linear-gradient(180deg, #22505f, var(--panel)); border: 2px solid var(--line); }
.big.mine { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 200, 87, .18); }
.big-who { font: 700 17px/1.15 'DM Sans', sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; }
.big.mine .big-who { color: var(--gold); }
.big-t { font: 400 46px/1 Anton, sans-serif; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--paper); min-width: 3.1ch; text-align: right; }
.big-bar { grid-column: 1 / 3; height: 8px; border-radius: 999px; background: rgba(0, 0, 0, .35); overflow: hidden; }
.big-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--coral)); transform-origin: 0 50%; transition: transform .1s linear; }
.big.hot .big-t { color: var(--coral); animation: beat .5s ease-in-out infinite; }
.big.hot .big-bar i { background: var(--coral); }
@keyframes beat { 50% { transform: scale(1.06); } }
.def { padding: 12px 14px 14px; border-radius: 16px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 5px 0 rgba(0, 0, 0, .28); animation: defin .3s cubic-bezier(.2, .9, .3, 1.15) both; }
.def-l { font: 700 11.5px 'DM Sans', sans-serif; color: var(--coral-d); letter-spacing: .02em; }
.def-t { font: 600 21px/1.25 'DM Sans', sans-serif; margin-top: 2px; text-wrap: balance; }
@keyframes defin { from { transform: translateY(10px) scale(.97); opacity: 0; } }
.tiles { --n: 8; display: flex; justify-content: center; gap: 5px; }
.tl { flex: 0 1 40px; aspect-ratio: 5 / 6; max-width: 40px; display: grid; place-items: center; border-radius: 8px; background: rgba(251, 243, 224, .1); border: 2px solid rgba(251, 243, 224, .28); color: var(--paper-ink); font: 400 26px/1 Anton, sans-serif; }
.tl.up { background: var(--paper); border-color: var(--paper); box-shadow: 0 3px 0 rgba(0, 0, 0, .3); }
.tl.new { animation: flipin .34s cubic-bezier(.3, 1.4, .4, 1) both; }
.tl.first.up { background: var(--gold); border-color: var(--gold); }
.def-l i { font-style: normal; font-weight: 600; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: rgba(12, 31, 39, .08); color: #40545b; }
.def.lv1 .def-l i { background: #ffe1a6; color: #6a4a00; } .def.lv2 .def-l i { background: #ffc4b5; color: #7a2413; }
.tiles.xlong { gap: 2px; } .tiles.xlong .tl { font-size: 17px; border-radius: 5px; border-width: 1.5px; }
.tiles.long { gap: 3px; } .tiles.long .tl { font-size: 21px; border-radius: 6px; }
.tiles.sm .tl { flex-basis: 28px; max-width: 28px; font-size: 18px; border-radius: 6px; }
.tiles.good .tl { background: var(--ok); border-color: var(--ok); }
.tiles.bad .tl { background: #ff8f7a; border-color: #ff8f7a; }
@keyframes flipin { from { transform: rotateX(90deg) scale(.8); } }
.ans { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.ans-in { text-transform: uppercase; font: 700 22px 'DM Sans', sans-serif; letter-spacing: .08em; min-height: 54px; border-color: var(--gold); }
.ans-in::placeholder { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 17px; color: #7d8c90; }
.ans-go { min-height: 54px; }
.ans-skip { margin-top: 8px; width: 100%; }
.shake { animation: shake .32s ease-in-out; border-color: var(--coral) !important; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.said { font-size: 16px; } .said b { font: 400 20px Anton, sans-serif; letter-spacing: .05em; color: var(--paper); } .said .no { color: var(--coral); font-weight: 700; }
.pause { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px; border-radius: 16px; background: var(--panel); border: 2px dashed var(--line); text-align: center; animation: defin .3s ease-out both; }
.pause-h { font: 400 30px/1.05 Anton, sans-serif; text-transform: uppercase; color: var(--paper); }
.pause.ok .pause-h { color: var(--ok); } .pause.out .pause-h { color: #ff8f7a; }
.pause-n { font: 600 15px 'DM Sans', sans-serif; color: var(--gold); min-height: 1.4em; }

/* ---------- finale ---------- */
.final-mast { align-items: center; text-align: center; gap: 6px; margin-top: 22px; }
.win-name { font-size: 60px; color: var(--gold); text-shadow: 0 4px 0 rgba(0, 0, 0, .35); overflow-wrap: anywhere; animation: winin .7s cubic-bezier(.2, 1.3, .4, 1) .2s both; }
.win-pts { color: var(--muted); font-weight: 600; }
.crown .logo { width: 70px; height: 70px; animation: winin .6s cubic-bezier(.3, 1.5, .4, 1) both; }
@keyframes winin { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
.rank { animation: rise .45s ease-out var(--d, 0ms) both; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.rank .pos { font: 400 24px Anton, sans-serif; min-width: 34px; color: var(--muted); }
.rank.p1 .pos { color: var(--gold); }
.rank.me .grow { color: var(--gold); }
.rank .pts { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.rank .pts b { font: 400 26px Anton, sans-serif; } .rank .pts small { font-size: 11px; color: var(--muted); }
@media (max-width: 360px) { .mast h1 { font-size: 52px; } .big-t { font-size: 40px; } .def-t { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<main id="app" data-screen=""><div class="msg"><p>Un attimo…</p></div></main>
