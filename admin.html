<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#d9e4ed">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The PP Games">
<title>Amministrazione · The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
/* Sala giochi — muro color carta da zucchero, i giochi sono scatole impilate */
:root { --wall: #d9e4ed; --navy: #15253a; --navy-2: #3d5066; --line: rgba(21, 37, 58, .16); --sun: #f6c445; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--wall); color: var(--navy); font: 400 16px/1.45 Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif; }
#app { max-width: 560px; margin: 0 auto; padding: 18px 18px calc(48px + env(safe-area-inset-bottom)); }
button { font-family: inherit; }
a { color: var(--navy); }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
h1, h2, p { margin: 0; }
.small { font-size: 14px; } .tiny { font-size: 12.5px; } .muted { color: var(--navy-2); }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.mast h1 { font: 800 40px/1 Figtree; letter-spacing: -.03em; }
.brand { display: flex; align-items: center; gap: 12px; margin: 8px 0 10px; }
.brand img { width: 64px; height: 64px; flex: 0 0 auto; }
.lead { color: var(--navy-2); font-size: 16px; }
.me { margin-top: 20px; min-height: 48px; }
.hello { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar { --c: #2a4fc4; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--c); color: #fff; font: 800 15px Figtree; flex: 0 0 auto; }
.hello-n { font: 800 23px/1.1 Figtree; overflow-wrap: anywhere; }
.linkbox .bigcode { font: 800 40px/1.1 Figtree; letter-spacing: .14em; margin: 10px 0 6px; }
.linkbox .row { margin-top: 12px; }
.warn { background: #fff; border-left: 4px solid #c8372a; padding: 12px 14px; border-radius: 8px; }
.warn p { margin-top: 4px; }

.lbl { display: block; font: 700 14px Figtree; }
.field { width: 100%; font: 500 17px Figtree; padding: 11px 14px; border: 2px solid rgba(21, 37, 58, .28); border-radius: 12px; background: #fff; color: var(--navy); min-height: 48px; }
.field:focus { border-color: var(--navy); outline: none; }
.code-in { max-width: 140px; text-transform: uppercase; letter-spacing: .2em; font-weight: 800; }
.code-in.wide { max-width: 190px; }
.btn { display: inline-flex; justify-content: center; align-items: center; font: 700 16px Figtree; border-radius: 12px; padding: 11px 18px; border: 2px solid var(--navy); background: #fff; color: var(--navy); text-decoration: none; cursor: pointer; min-height: 48px; white-space: nowrap; }
.btn.primary { background: var(--navy); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 12px; min-height: 36px; font-size: 14px; border-width: 1.5px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.link { background: none; border: 0; padding: 6px 0; color: var(--navy); font: 600 14px Figtree; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }

/* le scatole dei giochi, una sopra l'altra */
.box-diff { width: 93%; rotate: .6deg; background: #2a1d35; box-shadow: 0 7px 0 -1px #140d1a, 0 15px 18px -10px rgba(21, 37, 58, .5); }
.box-diff:active { box-shadow: 0 3px 0 -1px #140d1a, 0 8px 12px -8px rgba(21, 37, 58, .5); }
.box-diff .box-t { font: 600 27px/1.05 Fredoka, Figtree, sans-serif; color: #f8f1ff; }
.box-diff .box-s { color: #c6b6d9; }
.box-logo { position: relative; width: 58px; height: 44px; flex: 0 0 auto; }
.box-logo .ph { position: absolute; width: 40px; height: 28px; border-radius: 5px; border: 2.5px solid #fff; background: linear-gradient(#7cc8f0 56%, #74b85c 56%); }
.box-logo .ph.a { left: 0; top: 0; rotate: -8deg; }
.box-logo .ph.b { right: 0; bottom: 0; rotate: 6deg; }
.box-logo .ph.b::after { content: ""; position: absolute; right: 4px; top: 2px; width: 8px; height: 8px; border-radius: 50%; background: #ffd34d; }
.box-scv { width: 91%; rotate: -.5deg; background: #f2c443; box-shadow: 0 7px 0 -1px #c4951a, 0 15px 18px -10px rgba(21, 37, 58, .45); }
.box-scv:active { box-shadow: 0 3px 0 -1px #c4951a, 0 8px 12px -8px rgba(21, 37, 58, .45); }
.box-scv .box-t { font: 400 30px/1 'Lilita One', Figtree, sans-serif; color: #2b241d; letter-spacing: .01em; }
.box-scv .box-s { color: #4e4130; }
.box-grid { display: grid; grid-template-columns: repeat(2, 25px); gap: 4px; padding: 5px; background: #2b241d; border-radius: 9px; flex: 0 0 auto; }
.box-grid b { display: grid; place-items: center; height: 25px; background: #fbf6e9; border-radius: 5px; font: 400 16px/1 'Lilita One', Figtree, sans-serif; color: #2b241d; box-shadow: 0 2px 0 #d6c6a2; padding-top: 2px; }
.shelf { display: flex; flex-direction: column; align-items: center; gap: 16px; margin: 30px 0 8px; }
.box { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 16px 18px; border-radius: 6px; text-decoration: none; position: relative; transition: translate .12s ease, box-shadow .12s ease; }
.box:active { translate: 0 4px; }
.box-txt { display: flex; flex-direction: column; gap: 5px; min-width: 0; position: relative; }
.box-t { font-size: 27px; line-height: 1.05; }
.box-s { font: 500 13.5px/1.35 Figtree; }
.box-ncc { width: 95%; rotate: .7deg; background-color: #fbfcf9; background-image: linear-gradient(#dce7f0 1px, transparent 1px), linear-gradient(90deg, #dce7f0 1px, transparent 1px); background-size: 16px 16px; box-shadow: 0 7px 0 -1px #c3ced8, 0 15px 18px -10px rgba(21, 37, 58, .45); }
.box-ncc:active { box-shadow: 0 3px 0 -1px #c3ced8, 0 8px 12px -8px rgba(21, 37, 58, .45); }
.box-ncc::before { content: ""; position: absolute; top: 0; bottom: 0; left: 82px; width: 2px; background: #ec9a9a; }
.box-ncc .box-txt { padding-left: 4px; }
.box-ncc .box-t { font: 700 28px/1.05 Kalam, cursive; color: #2140a6; padding-top: 4px; }
.box-ncc .box-s { color: #4f5966; }
.box-ring { position: relative; width: 56px; height: 56px; flex: 0 0 auto; color: #c8372a; }
.box-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.box-ring path { fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; }
.box-ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 31px Kalam, cursive; color: #2140a6; padding-top: 6px; }
.box-fb { rotate: -.6deg; background: #1fae55 repeating-linear-gradient(90deg, #1fae55 0 34px, #189a49 34px 68px); box-shadow: 0 7px 0 -1px #0f7a37, 0 15px 18px -10px rgba(21, 37, 58, .55); }
.box-fb:active { box-shadow: 0 3px 0 -1px #0f7a37, 0 8px 12px -8px rgba(21, 37, 58, .5); }
.box-fb .box-t { font: 900 37px/1 'Big Shoulders Display', Impact, sans-serif; color: #fff; letter-spacing: .01em; text-transform: uppercase; text-shadow: 2px 3px 0 #0a1a44; }
.box-fb .box-t em { font-style: normal; color: #ffd60a; }
.box-fb .box-s { color: #fff; font-weight: 600; }
.box-env { width: 58px; height: 44px; flex: 0 0 auto; position: relative; rotate: -4deg; }
.box-env svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 0 rgba(6, 16, 46, .35)); }
.g-badge { font: 700 11.5px Figtree; padding: 3px 8px; border-radius: 5px; white-space: nowrap; flex: 0 0 auto; }
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 8px; padding: 10px 4px 10px 12px; background: #fff; border-radius: 12px; box-shadow: 0 2px 0 var(--line); }
.item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.it-top { display: flex; align-items: center; gap: 8px; }
.it-top .code { font: 800 16px Figtree; letter-spacing: .08em; }
.item.confirm { flex-wrap: wrap; padding-right: 12px; box-shadow: inset 0 0 0 1.5px #b3261e; }
.item.confirm .row { margin-left: auto; }
.x-btn { flex: 0 0 auto; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--navy-2); font: 400 26px/1 Figtree, sans-serif; cursor: pointer; }
.x-btn:hover { background: rgba(21, 37, 58, .07); color: var(--navy); }
.btn.danger { color: #b3261e; border-color: #b3261e; }
.g-ncc { background: #fbfcf9; color: #2140a6; box-shadow: inset 0 0 0 1px #c5d2de; }
.g-fantabusta { background: #1fae55; color: #fff; }
.g-scv { background: #f2c443; color: #2b241d; }
.g-diff { background: #2a1d35; color: #f8f1ff; }

.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 -4px 10px; padding: 0 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; font: 700 14px Figtree; color: var(--navy); background: transparent; border: 1.5px solid rgba(21, 37, 58, .3); border-radius: 999px; padding: 7px 14px; cursor: pointer; min-height: 38px; }
.tabs button[aria-selected=true] { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg { display: inline-flex; border: 1.5px solid var(--navy); border-radius: 10px; overflow: hidden; margin-bottom: 12px; background: rgba(255, 255, 255, .5); }
.seg button { font: 600 13.5px Figtree; color: var(--navy); background: transparent; border: 0; padding: 8px 12px; cursor: pointer; min-height: 38px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--navy); color: #fff; }
table.board { width: 100%; border-collapse: collapse; font-size: 15px; background: #fff; border-radius: 12px; overflow: hidden; }
.board th { font: 700 12px Figtree; color: var(--navy-2); text-align: right; padding: 10px 10px 6px; }
.board td { padding: 10px; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.board .l { text-align: left; }
.board .pos { width: 34px; text-align: center; font-weight: 800; color: var(--navy-2); }
.board .nm { font-weight: 600; overflow-wrap: anywhere; }
.board .pts { font-weight: 800; }
.board tr.me td { background: #fff3c9; }
.board tr.p1 .pos { color: #a87400; }
.foot { margin-top: 44px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; font: 600 14px Figtree; max-width: 88vw; z-index: 30; text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.toast.hidden { display: none; }
@media (prefers-reduced-motion: reduce) { .box { transition: none; } }
@media (max-width: 360px) { .mast h1 { font-size: 34px; } .brand img { width: 54px; height: 54px; } .box-t { font-size: 24px; } .box-fb .box-t { font-size: 31px; } }

/* apertura: il logo */
#splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--wall); transition: opacity .45s ease; }
#splash img { width: min(66vw, 290px); height: auto; }
#splash .splash-n { display: none; font: 800 30px/1 Figtree, system-ui, sans-serif; letter-spacing: -.02em; color: var(--navy); }
#splash.out { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { #splash { transition: none; } }

/* tasto dei suoni */
:root { --tool-bg: #fff; --tool-bg-solid: #fff; --tool-ink: var(--navy); --tool-bd: 2px solid var(--navy); --tool-ring: var(--wall); --chat-bg: #fff; --chat-ink: var(--navy); --chat-font: Figtree, system-ui, sans-serif; }
.brand .tools { margin-left: auto; align-self: flex-start; }
.box-psg { rotate: .5deg; background: #0b6f76 radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, .14), transparent 60%); box-shadow: 0 7px 0 -1px #064a50, 0 15px 18px -10px rgba(21, 37, 58, .5); }
.box-psg:active { box-shadow: 0 3px 0 -1px #064a50, 0 8px 12px -8px rgba(21, 37, 58, .5); }
.box-psg .box-t { font: 400 25px/1.05 Bungee, Figtree, sans-serif; color: #fff7e6; }
.box-psg .box-s { color: #bfe3e2; }
.box-tiles { display: grid; grid-template-columns: repeat(3, 17px); gap: 3px; flex: 0 0 auto; }
.box-tiles b { display: grid; place-items: center; width: 17px; height: 21px; border-radius: 3px; background: #fff7e6; color: #0b3438; font: 400 12px Bungee, Figtree, sans-serif; box-shadow: 0 2px 0 #064a50; }
.box-tiles b.h { background: #0f8790; box-shadow: inset 0 2px 0 rgba(0, 0, 0, .18), 0 2px 0 #064a50; }
.g-psg { background: #0b6f76; color: #fff7e6; }

.box-quiz { width: 96%; rotate: -.4deg; background: #120a3d radial-gradient(120% 120% at 50% -30%, rgba(130, 104, 255, .55), transparent 65%); box-shadow: 0 7px 0 -1px #07041c, 0 15px 18px -10px rgba(21, 37, 58, .5); }
.box-quiz:active { box-shadow: 0 3px 0 -1px #07041c, 0 8px 12px -8px rgba(21, 37, 58, .5); }
.box-quiz .box-t { font: 800 36px/1 'Saira Condensed', Figtree, sans-serif; color: #ffc53d; letter-spacing: .01em; text-shadow: 0 0 18px rgba(255, 197, 61, .35); }
.box-quiz .box-s { color: #c4bff0; }
.box-hex { display: grid; grid-template-columns: repeat(2, 30px); gap: 4px; flex: 0 0 auto; }
.box-hex i { font: 800 10px/16px 'Saira Condensed', Figtree, sans-serif; font-style: normal; color: #ffc53d; padding-left: 7px; height: 16px; background: linear-gradient(#2a1d86, #160d52); clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 50%, calc(100% - 5px) 100%, 5px 100%, 0 50%); }
.box-hex i.lk { background: linear-gradient(#ffb24a, #ff8c1a); color: #2b1300; }
.box-hex i.ok { background: linear-gradient(#6ff5aa, #1fb862); color: #052614; }
.g-quiz { background: #120a3d; color: #ffc53d; }

.box-gp { width: 94%; rotate: .5deg; background: #d8d3c9 repeating-linear-gradient(180deg, transparent 0 23px, rgba(28, 27, 25, .07) 23px 24px); box-shadow: 0 7px 0 -1px #a8a296, 0 15px 18px -10px rgba(21, 37, 58, .45); }
.box-gp:active { box-shadow: 0 3px 0 -1px #a8a296, 0 8px 12px -8px rgba(21, 37, 58, .45); }
.box-gp .box-t { font: 800 34px/1 'Barlow Condensed', Figtree, sans-serif; color: #1c1b19; }
.box-gp .box-s { color: #4b4943; }
.box-flip { display: flex; gap: 4px; padding: 6px; background: #161616; border-radius: 9px; flex: 0 0 auto; }
.box-flip b { position: relative; display: grid; place-items: center; width: 24px; height: 32px; border-radius: 3px; background: linear-gradient(#2d2d2c 50%, #1f1f1e 50%); color: #f2ede1; font: 800 22px/1 'Barlow Condensed', Figtree, sans-serif; }
.box-flip b::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 2px; background: #080808; }
.g-gp { background: #161616; color: #f2ede1; }

/* Pannello dell'amministratore (si aggiunge a hub.css) */
.sec { margin-top: 26px; }
.sec > h2 { font: 800 22px Figtree; letter-spacing: -.01em; margin-bottom: 4px; }
.sec > p { margin-bottom: 12px; }
.sec > p + .btn, .sec > p + p { margin-top: 10px; }
.adm-top { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 4px; }
.adm-top .back { font: 600 14px Figtree; color: var(--navy-2); text-decoration: none; }
.adm-top h1 { font: 800 34px/1.05 Figtree; letter-spacing: -.03em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: #fff; border-radius: 12px; padding: 10px 12px 12px; box-shadow: 0 2px 0 var(--line); display: flex; flex-direction: column; gap: 2px; }
.stats b { font: 800 30px/1 Figtree; }
.stats span { font-size: 12.5px; color: var(--navy-2); line-height: 1.25; }
.warn-t { color: #b3261e; margin-top: 10px; }
.ulist { display: grid; gap: 8px; }
.urow { background: #fff; border-radius: 12px; box-shadow: 0 2px 0 var(--line); }
.urow.open { box-shadow: inset 0 0 0 2px var(--navy); }
.uhead { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 12px; font: inherit; color: inherit; cursor: pointer; border-radius: 12px; }
.uhead .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.un { font-weight: 800; font-size: 17px; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font: 700 11px Figtree; padding: 2px 7px; border-radius: 999px; background: var(--wall); color: var(--navy); vertical-align: 2px; }
.tag.gold { background: var(--sun); }
.chev { font-size: 24px; color: var(--navy-2); transition: rotate .15s ease; }
.urow.open .chev { rotate: 90deg; }
.uact { padding: 0 12px 14px 68px; display: flex; flex-direction: column; gap: 8px; }
.uact.row { flex-direction: row; flex-wrap: wrap; gap: 8px; }
.uact .row { flex-wrap: wrap; gap: 8px; }
.uact .row .field { flex: 1 1 180px; min-height: 40px; padding: 8px 12px; font-size: 16px; }
.uact select.field { min-height: 44px; }
.warnbox p { line-height: 1.45; }
.bulk { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #fff8e1; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.glist { display: grid; gap: 8px; }

@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

/* Tempo di gioco */
.tp-tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-radius: 12px; padding: 4px; gap: 4px; box-shadow: 0 2px 0 var(--line); }
.tp-tabs button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font: 700 14.5px Figtree; color: var(--navy-2); cursor: pointer; }
.tp-tabs button[aria-selected=true] { background: var(--navy); color: #fff; }
.tp-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 10px 0 2px; text-align: center; }
.tp-nav b { font-size: 16px; }
.tp-arrow { width: 44px; height: 44px; border: 0; border-radius: 12px; background: #fff; font: 400 26px/1 Figtree; color: var(--navy); cursor: pointer; box-shadow: 0 2px 0 var(--line); }
.tp-arrow:disabled { opacity: .35; cursor: default; }
.tp-empty { margin-top: 10px; }
.tp-hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 14px 0 4px; }
.tp-hero b { font: 800 48px/1 Figtree; letter-spacing: -.02em; }
.tp-hero span { color: var(--navy-2); font-size: 15px; }
.tp-h { font: 800 15px Figtree; margin: 18px 0 8px; }
.rank { display: grid; gap: 8px; background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 0 var(--line); }
.rk { display: grid; grid-template-columns: minmax(96px, 34%) 1fr auto; align-items: center; gap: 10px; }
.rk-n { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk-bar { height: 12px; display: block; }
.rk-bar span { display: block; height: 12px; border-radius: 0 4px 4px 0; }
.rk-v { font-size: 13.5px; color: var(--navy-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tlist { display: grid; gap: 8px; }
.trow { background: #fff; border-radius: 12px; padding: 4px 12px 12px; box-shadow: 0 2px 0 var(--line); }
.trow.open { box-shadow: inset 0 0 0 2px var(--navy); }
.thead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; min-height: 40px; padding: 8px 0 6px; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.thead:disabled { cursor: default; }
.tn { font-weight: 800; font-size: 16px; }
.tv { font-weight: 700; font-variant-numeric: tabular-nums; }
.gseg { display: flex; gap: 2px; height: 8px; border-radius: 999px; overflow: hidden; }
.gseg span { display: block; min-width: 3px; }
.tlegend { margin-top: 6px; color: var(--navy-2); line-height: 1.6; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.cols { display: flex; align-items: flex-end; gap: 2px; height: 58px; margin: 14px 0 24px; position: relative; border-bottom: 1px solid var(--line); }
.col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; outline-offset: 2px; }
.col-b { display: block; width: 100%; max-width: 30px; background: var(--navy); border-radius: 4px 4px 0 0; }
