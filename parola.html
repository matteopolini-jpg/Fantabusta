<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b6f76">
<meta name="description" content="Parola segreta: scopri la parola lettera per lettera o indovina la catena di parole collegate.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The PP Games">
<title>Parola segreta – The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bungee&amp;display=swap">
<style>
/* Parola segreta — il tabellone di un gioco a quiz: fondo verde acqua, tessere color crema, lettere Bungee */
:root { --teal: #0b6f76; --teal-2: #0f8790; --deep: #064a50; --cream: #fff7e6; --ink: #0b3438; --amber: #ffb627; --coral: #ff5d73; --mint: #7ef0c5; --muted: #bfe3e2; --line: rgba(255, 247, 230, .2); --bad: #ff5d73; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; color: var(--cream); font: 400 16px/1.45 Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--teal) radial-gradient(120% 60% at 50% -10%, rgba(255, 255, 255, .14), transparent 60%); background-attachment: scroll; }
#app { max-width: 520px; margin: 0 auto; padding: 10px 16px calc(112px + env(safe-area-inset-bottom)); }
button { font-family: inherit; }
a { color: var(--cream); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
h1, h2, p { margin: 0; }
h1 { font: 400 30px/1.08 Bungee, Figtree, sans-serif; letter-spacing: .01em; }
h2 { font: 400 19px/1.2 Bungee, Figtree, sans-serif; letter-spacing: .02em; }
.small { font-size: 14px; } .tiny { font-size: 12.5px; } .muted { color: var(--muted); } .center { text-align: center; }
.blk { margin-top: 26px; } .field-row { margin: 18px 0; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.top-r { display: flex; align-items: center; gap: 10px; font: 700 13px Figtree; color: var(--muted); }
.top-t { white-space: nowrap; }
.link { background: none; border: 0; padding: 8px 0; color: var(--cream); font: 700 15px Figtree; text-decoration: none; cursor: pointer; }
.mast { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin: 12px 0 6px; }
.lobby-mast { flex-direction: row; justify-content: space-between; align-items: flex-end; }
.lead { color: var(--muted); font-size: 15px; max-width: 34em; }
.hello { font-size: 15px; margin-top: 14px; }

/* tessere */
.logo { display: inline-flex; gap: 4px; }
.logo b, .tiles b, .tl { display: inline-grid; place-items: center; width: 30px; height: 38px; border-radius: 6px; background: var(--cream); color: var(--ink); font: 400 20px/1 Bungee, Figtree, sans-serif; box-shadow: inset 0 -3px 0 rgba(11, 52, 56, .22), 0 3px 0 var(--deep); }
.logo b.h, .tiles b:not(.op):empty, .tl:not(.op) { background: var(--teal-2); box-shadow: inset 0 3px 0 rgba(0, 0, 0, .18), 0 3px 0 var(--deep); }
.tiles { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.tiles.big b { width: 38px; height: 48px; font-size: 26px; }
.bigcode { margin-top: 4px; }

/* moduli */
.lbl { display: block; font: 700 14px Figtree; margin: 0 0 8px; }
.field { width: 100%; font: 500 17px Figtree; padding: 11px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--deep); color: var(--cream); min-height: 48px; }
.field::placeholder { color: #8fc0bf; }
.field:focus { border-color: var(--amber); outline: none; }
.code-in { max-width: 150px; text-transform: uppercase; letter-spacing: .14em; font: 400 20px Bungee, Figtree, sans-serif; }
.seg { display: flex; border: 2px solid var(--cream); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; font: 700 14.5px Figtree; color: var(--cream); background: transparent; border: 0; padding: 10px 4px; min-height: 44px; cursor: pointer; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--cream); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { font: 700 14px Figtree; color: var(--cream); background: transparent; border: 2px solid var(--line); border-radius: 999px; padding: 7px 13px; min-height: 40px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--amber); border-color: var(--amber); color: var(--ink); }
.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--cream); background: transparent; color: var(--cream); font: 700 22px Figtree; cursor: pointer; }
.stepper output { font: 400 28px Bungee, Figtree, sans-serif; min-width: 36px; text-align: center; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; font: 800 16px Figtree; border-radius: 12px; padding: 12px 18px; border: 2px solid var(--cream); background: transparent; color: var(--cream); text-decoration: none; cursor: pointer; min-height: 48px; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--ink); box-shadow: 0 4px 0 #b97900; }
.btn.primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #b97900; }
.btn.sm { padding: 5px 11px; min-height: 34px; font-size: 14px; border-width: 1.5px; border-radius: 9px; box-shadow: none; }
.btn.block { width: 100%; }
.btn.danger { color: var(--coral); border-color: var(--coral); }
.btn:disabled { opacity: .5; cursor: default; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.code-tag { font: 400 18px Bungee, Figtree, sans-serif; letter-spacing: .06em; }
.on { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 247, 230, .3); flex: 0 0 auto; }
.on.yes { background: var(--mint); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.pill { font: 700 12.5px Figtree; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
.count { font: 400 18px Bungee, Figtree, sans-serif; color: var(--muted); }
.who-dot { --c: #3b82f6; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font: 800 10.5px Figtree; flex: 0 0 auto; }
.teams { display: grid; gap: 10px; margin-top: 10px; }
.team { border: 2px solid var(--c); border-radius: 14px; padding: 8px 12px 4px; background: rgba(0, 0, 0, .08); }
.team-h { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
.team-n { font: 400 18px Bungee, Figtree, sans-serif; color: var(--c); }
.team-chip { --c: #e5484d; display: inline-block; background: var(--c); color: #fff; font: 800 12px Figtree; padding: 3px 9px; border-radius: 7px; white-space: nowrap; }
.team .item:last-child { border-bottom: 0; }
.shuffle { margin-top: 12px; }

/* scelta della parola */
.pick { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.pick .logo { align-self: center; margin-top: 18px; }
.pk-list { display: grid; gap: 7px; }
.pk-row { display: flex; align-items: center; gap: 10px; }
.pk-n { font: 400 16px Bungee, Figtree, sans-serif; width: 22px; color: var(--amber); text-align: center; }

/* manche */
.hud { display: flex; align-items: center; gap: 16px; margin: 2px 0 8px; }
.clock { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.clock-t { font: 400 30px/1 Bungee, Figtree, sans-serif; }
.js-count.hot { color: var(--coral); }
.bar { display: block; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, .2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--amber); transform-origin: left; }
.bar i.hot { background: var(--coral); }
.found { text-align: right; }
.found-n { display: block; font: 400 28px/1 Bungee, Figtree, sans-serif; color: var(--amber); }
.hearts { display: inline-flex; gap: 2px; font-size: 22px; line-height: 1; }
.hearts i { font-style: normal; color: rgba(255, 247, 230, .35); }
.hearts i::before { content: "♡"; }
.hearts i.full { color: var(--coral); }
.hearts i.full::before { content: "♥"; }
.cat { font: 700 14px Figtree; color: var(--amber); margin: 4px 0 8px; }
.board-wrap { position: relative; margin: 2px 0 12px; }
.board { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; padding: 18px 12px; border-radius: 16px; background: var(--deep); box-shadow: inset 0 0 0 3px rgba(255, 247, 230, .14); min-height: 110px; align-content: center; }
.bw { display: inline-flex; gap: 4px; }
.pc { display: inline-grid; place-items: end center; height: 38px; font: 400 22px Bungee, Figtree, sans-serif; color: var(--cream); min-width: 8px; }
.tl.op { animation: flip .35s ease-out; }
@keyframes flip { from { transform: rotateX(80deg); } to { transform: none; } }
.keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.key { height: 46px; border-radius: 9px; border: 0; background: var(--cream); color: var(--ink); font: 400 19px Bungee, Figtree, sans-serif; cursor: pointer; box-shadow: 0 3px 0 var(--deep); touch-action: manipulation; }
.key:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--deep); }
.key.hit { background: var(--mint); opacity: .75; }
.key.miss { background: transparent; color: rgba(255, 247, 230, .45); box-shadow: inset 0 0 0 2px rgba(255, 247, 230, .25); text-decoration: line-through; }
.solve-row { margin: 4px 0 12px; }
.solve { margin: 4px 0 6px; }
.note { border-radius: 12px; padding: 12px 14px; background: rgba(0, 0, 0, .16); margin: 4px 0 12px; font-size: 15px; }
.note.good { background: rgba(126, 240, 197, .18); color: var(--mint); font-weight: 700; }
.note.bad { background: rgba(255, 93, 115, .18); color: #ffc2cb; }
.others { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.oth { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: rgba(0, 0, 0, .16); font-size: 14px; }
.oth .nm { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oth b { font: 400 14px Bungee, Figtree, sans-serif; color: var(--amber); }
.oth.ok b { color: var(--mint); } .oth.out { opacity: .55; } .oth.off { opacity: .45; }
.oth .team-chip { margin-left: 2px; }
.cover { position: absolute; inset: -4px; border-radius: 18px; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .15s; }
.cover.show { opacity: 1; pointer-events: auto; }
.cover.wait, .cover.over { background: rgba(6, 74, 80, .95); }
.cover.lock { background: rgba(255, 93, 115, .35); pointer-events: none; }
#cover-t { font: 400 30px Bungee, Figtree, sans-serif; color: var(--cream); text-align: center; padding: 0 16px; }
.cover.wait #cover-t { font-size: 72px; color: var(--amber); }

/* catena */
.chain { display: flex; flex-direction: column; gap: 9px; padding: 14px 12px; border-radius: 16px; background: var(--deep); box-shadow: inset 0 0 0 3px rgba(255, 247, 230, .14); }
.chain.small { padding: 10px; }
.crow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.crow .tiles b { width: 27px; height: 34px; font-size: 18px; }
.crow.next .tiles b { background: rgba(255, 247, 230, .08); box-shadow: inset 0 0 0 1.5px rgba(255, 247, 230, .22); }
.crow.cur { padding: 6px; margin: 0 -6px; border-radius: 10px; background: rgba(255, 182, 39, .14); box-shadow: inset 0 0 0 2px var(--amber); }
.crow.cur .tiles b { width: 31px; height: 40px; font-size: 21px; }
.crow.won .tiles b.op { background: var(--mint); }
.crow.lost .tiles b.op { background: #ffd1d8; }
.ctag { --c: var(--amber); font: 800 12.5px Figtree; background: var(--c); color: #fff; padding: 3px 8px; border-radius: 7px; white-space: nowrap; }
.ctag.none { background: rgba(255, 247, 230, .2); color: var(--cream); }
.crow:first-child .ctag { background: rgba(255, 247, 230, .2); color: var(--cream); }
.guess { margin-top: 2px; }
.guess .field { font: 400 20px Bungee, Figtree, sans-serif; text-transform: uppercase; letter-spacing: .04em; }
.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* risultati */
.rhead { margin: 6px 0 10px; }
.rhead p { margin-top: 6px; }
.board-list { margin-top: 16px; }
.board-list ol { list-style: none; margin: 8px 0 0; padding: 0; }
.board-list li { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.board-list li.me .nm { font-weight: 800; }
.board-list .pos { font: 400 18px Bungee, Figtree, sans-serif; width: 22px; text-align: center; color: var(--muted); }
.board-list .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-list .plus { font: 400 15px Bungee, Figtree, sans-serif; color: var(--mint); }
.board-list .tot { font: 400 24px Bungee, Figtree, sans-serif; min-width: 44px; text-align: right; color: var(--amber); }
.winner { text-align: center; margin: 16px 0 4px; }
.win-name { font-size: 36px !important; margin: 4px 0; }
.win-pts { font: 400 22px Bungee, Figtree, sans-serif; color: var(--amber); }
.htable-wrap { overflow-x: auto; margin-top: 8px; }
.htable { border-collapse: collapse; width: 100%; font-size: 15px; }
.htable th, .htable td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.htable td:first-child { text-align: left; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.htable td.tot { font: 400 17px Bungee, Figtree, sans-serif; color: var(--amber); }
.htable tr.me td:first-child { font-weight: 800; }
.sticky { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(11, 111, 118, 0), var(--teal) 35%); display: flex; justify-content: center; z-index: 5; }
.sticky .btn { max-width: 488px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: 40px; }
.rules { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 10px; }
.rules summary { font: 800 16px Figtree; cursor: pointer; padding: 6px 0; }
.rules ol { padding-left: 20px; font-size: 14.5px; color: var(--muted); }
.rules li { margin: 7px 0; }
.overlay { position: fixed; inset: 0; background: rgba(2, 30, 33, .6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--deep); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin-bottom: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--cream); color: var(--ink); padding: 10px 16px; border-radius: 12px; font: 700 14px Figtree; max-width: 88vw; z-index: 30; text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .3); }
.toast.hidden { display: none; }
@media (max-width: 370px) { .tl, .logo b, .tiles b { width: 26px; height: 34px; font-size: 17px; } .keys { gap: 5px; } .key { height: 42px; font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { .cover { transition: none; } .tl.op, .shake { animation: none; } }

/* tasti dei suoni e della chat */
:root { --tool-bg: var(--deep); --tool-bg-solid: var(--deep); --tool-ink: var(--cream); --tool-bd: 1px solid var(--line); --tool-ring: var(--teal);
  --chat-bg: #08585e; --chat-ink: var(--cream); --chat-acc: var(--amber); --chat-acc-ink: var(--ink); --chat-muted: var(--muted); --chat-line: var(--line); --chat-them: rgba(255, 255, 255, .1); --chat-field: rgba(0, 0, 0, .15); --chat-badge: var(--coral); --chat-font: Figtree, system-ui, sans-serif; }
/* parole lunghe: tessere più piccole perché la parola stia su una riga */
.board.s10 .tl { width: 25px; height: 33px; font-size: 17px; } .board.s10 .pc { height: 33px; font-size: 17px; }
.board.s12 .tl { width: 21px; height: 29px; font-size: 15px; } .board.s12 .pc { height: 29px; font-size: 15px; }
.board.s14 .tl { width: 19px; height: 27px; font-size: 14px; } .board.s14 .pc { height: 27px; font-size: 14px; }
.board.s12 .bw, .board.s14 .bw { gap: 3px; }
.crow.s10 .tiles b, .crow.cur.s10 .tiles b { width: 24px; height: 31px; font-size: 16px; }
.crow.s12 .tiles b, .crow.cur.s12 .tiles b, .crow.s14 .tiles b, .crow.cur.s14 .tiles b { width: 20px; height: 27px; font-size: 14px; }
.crow.s12 .tiles, .crow.s14 .tiles { gap: 3px; }

</style>
</head>
<body>
<main id="app" data-screen=""><div class="msg"><p>Un attimo…</p></div></main>
<noscript><p style="padding:16px">Il gioco ha bisogno di JavaScript attivo.</p></noscript>
<script src="config.js"></script>
<script type="module" src="parola.js?v=4cd12eb5"></script>
</body>
</html>
