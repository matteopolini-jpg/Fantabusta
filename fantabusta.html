<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1fae55">
<meta name="description" content="L'asta a buste chiuse sui migliori calciatori d'Europa.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FantaBusta">
<title>FantaBusta – The PP Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
/* FantaBusta — una domenica allo stadio. La pagina è il campo (strisce di erba tagliata);
   i numeri stanno sul tabellone (blu notte, cifre gialle a led); le cose di carta sono di carta:
   la figurina del giocatore e la busta gialla con il sigillo di ceralacca. */
:root {
  --grass-a: #1fae55;
  --grass-b: #189a49;
  --grass-deep: #0f7a37;
  --chalk: #ffffff;
  --navy: #0a1a44;
  --navy-2: #1b3274;
  --navy-3: #06102e;
  --ink: #0a1a44;
  --muted: #52618a;
  --soft: #eef2fa;
  --line: #d6dcec;
  --sun: #ffd60a;
  --sun-2: #c9a500;
  --red: #ef2b3c;
  --red-2: #a8121f;
  --manila: #f6cf7d;
  --manila-ink: #4a3410;
  --ok: #19b85a;
  --r-por: #ff9f1c;
  --r-dif: #17a957;
  --r-cen: #2f7bff;
  --r-tre: #9b5cff;
  --r-att: #ff3b4a;
  --display: 'Big Shoulders Display', 'Big Shoulders', 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  /* tasti in alto e chat */
  --tool-bg: #fff; --tool-bg-solid: #fff; --tool-ink: var(--navy); --tool-bd: 2px solid var(--navy); --tool-ring: var(--grass-a);
  --chat-bg: #fff; --chat-ink: var(--navy); --chat-acc: var(--navy); --chat-acc-ink: #fff; --chat-muted: var(--muted); --chat-line: var(--line); --chat-them: var(--soft); --chat-badge: var(--red); --chat-font: var(--body);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--grass-a);
  background-image:
    radial-gradient(130% 70% at 50% 0%, rgba(255, 255, 255, 0.10), transparent 60%),
    repeating-linear-gradient(180deg, var(--grass-a) 0 76px, var(--grass-b) 76px 152px);
  color: var(--chalk);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
#app { max-width: 520px; margin: 0 auto; padding: 8px 16px 56px; display: flex; flex-direction: column; gap: 16px; position: relative; }
h1, h2, h3 { font-family: var(--display); font-weight: 900; letter-spacing: 0.005em; line-height: 0.95; margin: 0; text-wrap: balance; text-transform: uppercase; }
h2 { font-size: 28px; }
h3 { font-size: 22px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14.5px; }
.tiny { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.gap6 { gap: 6px; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.center { text-align: center; }
.hidden { display: none !important; }
.warn-t { color: var(--red); }
#app > section:empty, .stage > div:empty { display: none; }

/* ---------- barra in alto ---------- */
.top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.top .link { color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; padding: 8px 0; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
.top-r { display: flex; align-items: center; gap: 10px; }
.top-t { font-weight: 700; font-size: 13.5px; color: rgba(255, 255, 255, 0.92); white-space: nowrap; }
.tool { box-shadow: 0 3px 0 var(--navy); }

/* ---------- testata: il cerchio di centrocampo dietro il nome ---------- */
.mast { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 0 6px; text-align: center; isolation: isolate; }
.mast::before { content: ""; position: absolute; z-index: -1; left: 50%; top: -31px; width: 160px; height: 160px; transform: translateX(-50%); border: 3px solid rgba(255, 255, 255, 0.6); border-radius: 50%; }
.mast::after { content: ""; position: absolute; z-index: -1; left: -40px; right: -40px; top: 47.5px; height: 3px; background: rgba(255, 255, 255, 0.6); }
.mast.final::before { top: -27px; } .mast.final::after { top: 51.5px; }
.mast .crest { width: 82px; height: 62px; filter: drop-shadow(0 4px 0 rgba(6, 16, 46, 0.35)); transform: rotate(-4deg); }
.mast .trophy { width: 70px; height: 70px; filter: drop-shadow(0 4px 0 rgba(6, 16, 46, 0.35)); }
.mast .logo { font-family: var(--display); font-weight: 900; font-size: 66px; line-height: 0.82; text-transform: uppercase; color: #fff; text-shadow: 3px 4px 0 var(--navy); letter-spacing: 0.01em; }
.mast .logo span { color: var(--sun); }
.mast .tag { color: #fff; font-size: 15.5px; font-weight: 600; max-width: 30ch; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
.mast.final .logo { font-size: 58px; }

/* ---------- pannelli bianchi appoggiati sull'erba ---------- */
.panel { background: #fff; color: var(--ink); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 0 var(--grass-deep); }
.panel h2 { font-size: 26px; color: var(--navy); }
.lbl { font-size: 14px; font-weight: 800; color: var(--navy); }
.field { width: 100%; background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 17px; min-height: 50px; }
.field:focus { border-color: var(--navy); outline: none; }
.field::placeholder { color: #8d97b3; }
.code-in { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; }
.btn { border-radius: 12px; padding: 11px 18px; font-weight: 800; font-size: 16px; background: #fff; color: var(--navy); border: 2px solid var(--navy); box-shadow: 0 4px 0 var(--navy); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; text-decoration: none; transition: transform 0.08s ease, box-shadow 0.08s ease; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--navy); color: #fff; box-shadow: 0 4px 0 var(--navy-3); border-color: var(--navy); }
.btn.gold { background: var(--sun); color: var(--navy); }
.btn.ghost { background: #fff; box-shadow: none; }
.btn.ghost:active:not(:disabled) { transform: none; background: var(--soft); }
.btn.danger { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 0 4px 0 var(--red); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 7px 12px; font-size: 14px; border-radius: 10px; box-shadow: 0 3px 0 var(--navy); }
.btn.sm.ghost { box-shadow: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { border: 2px solid var(--line); background: #fff; color: var(--navy); border-radius: 11px; padding: 9px 6px; font-weight: 800; min-height: 46px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--sun); border-color: var(--navy); }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
.stepper button { min-height: 50px; border-radius: 12px; border: 2px solid var(--navy); background: #fff; color: var(--navy); font-size: 26px; font-weight: 800; box-shadow: 0 3px 0 var(--navy); }
.stepper button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--navy); }
.stepper output { text-align: center; font-family: var(--display); font-size: 40px; font-weight: 900; color: var(--navy); line-height: 1; }

/* ---------- elenchi ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--soft); color: var(--ink); }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.08em; color: var(--navy); background: var(--sun); padding: 1px 8px 0; border-radius: 7px; line-height: 1.15; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #c3cadb; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(25, 184, 90, 0.2); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 17px; color: var(--navy); flex: none; box-shadow: inset 0 0 0 2px rgba(10, 26, 68, 0.18); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 800; background: var(--soft); color: var(--navy); white-space: nowrap; }
.pill.gold { background: var(--sun); }
.item .pill { background: #fff; }
.leagues { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.lg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px 10px; min-height: 48px; border-radius: 11px; border: 2px solid var(--line); background: #fff; color: var(--navy); text-align: left; font-weight: 800; font-size: 14px; }
.lg .lgn { line-height: 1.15; overflow-wrap: anywhere; }
.lg .lgc { font-size: 12px; color: var(--muted); font-weight: 700; }
.lg[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.lg[aria-pressed="true"] .lgc { color: var(--sun); }

/* ---------- scelta del modulo ---------- */
.formations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fcard { border: 2px solid var(--line); border-radius: 13px; background: #fff; color: var(--navy); padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.fcard[aria-pressed="true"] { border-color: var(--navy); background: var(--sun); box-shadow: 0 4px 0 var(--navy); }
.fcard .fname { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1; }
.mini-pitch { width: 100%; aspect-ratio: 3 / 3.6; border-radius: 7px; background: repeating-linear-gradient(180deg, var(--grass-a) 0 16.6%, var(--grass-b) 16.6% 33.3%); position: relative; overflow: hidden; }
.mini-pitch::before { content: ""; position: absolute; inset: 6%; border: 1.5px solid rgba(255, 255, 255, 0.7); border-radius: 2px; }
.mini-pitch i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px var(--navy); transform: translate(-50%, -50%); }

/* ---------- il tabellone: giro, soldi, codice ---------- */
.ghead { display: flex; align-items: stretch; justify-content: space-between; gap: 12px; background: var(--navy); color: #fff; border-radius: 16px; padding: 10px 16px 12px; border: 3px solid var(--navy-2); box-shadow: 0 5px 0 var(--navy-3); }
.ghead .left { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
.cap { font-size: 12.5px; font-weight: 700; color: #b9c4e6; }
.led { font-family: var(--display); font-weight: 900; color: var(--sun); line-height: 0.9; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255, 214, 10, 0.45);
  -webkit-mask-image: radial-gradient(circle, #000 1.25px, rgba(0, 0, 0, 0.82) 1.6px); mask-image: radial-gradient(circle, #000 1.25px, rgba(0, 0, 0, 0.82) 1.6px); -webkit-mask-size: 3.5px 3.5px; mask-size: 3.5px 3.5px; }
.ghead .round { font-size: 52px; }
.ghead .bigcode { font-size: 48px; letter-spacing: 0.08em; }
.wallet { text-align: right; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; }
.wallet .money { font-size: 44px; }
.wallet .money small { font-size: 20px; margin-left: 3px; }
.wallet .pill { background: var(--navy-2); color: #fff; }

/* ---------- la figurina del giocatore estratto ---------- */
.stage { position: relative; display: flex; flex-direction: column; gap: 14px; }
.figurina {
  --role: var(--r-cen);
  background: #fff; color: var(--ink); border-radius: 16px; padding: 8px;
  box-shadow: 0 6px 0 rgba(6, 16, 46, 0.35), 0 18px 30px rgba(6, 16, 46, 0.25);
  transform: rotate(-1.4deg);
}
.figurina .frame { border-radius: 10px; padding: 0 14px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; position: relative; overflow: hidden; background: linear-gradient(160deg, #fff 55%, color-mix(in srgb, var(--role) 14%, #fff)); border: 3px solid var(--role); }
.figurina .club { grid-column: 1 / -1; margin: 0 -14px 4px; padding: 7px 14px 6px; background: var(--role); color: #fff; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; display: flex; gap: 6px; align-items: center; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
.figurina .pname { font-family: var(--display); font-weight: 900; font-size: 50px; line-height: 0.88; text-transform: uppercase; letter-spacing: 0; color: var(--navy); overflow-wrap: normal; word-break: normal; min-width: 0; overflow: hidden; padding-bottom: 2px; align-self: center; }
.figurina .pname.m { font-size: 43px; } .figurina .pname.s { font-size: 36px; } .figurina .pname.xs { font-size: 29px; }
.figurina .fullname { font-size: 14px; font-weight: 600; color: var(--muted); grid-column: 1 / -1; }
.figurina .shirt { grid-row: 2 / 4; grid-column: 2; align-self: center; width: 78px; height: 78px; filter: drop-shadow(0 3px 0 rgba(6, 16, 46, 0.25)); }
.figurina .medal { grid-row: 2 / 4; grid-column: 2; align-self: center; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1a8, var(--sun) 55%, var(--sun-2)); color: var(--navy); display: grid; place-items: center; align-content: center; box-shadow: 0 4px 0 var(--navy), inset 0 0 0 3px rgba(255, 255, 255, 0.5); border: 2px solid var(--navy); }
.figurina .medal .mv { font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 0.9; }
.figurina .medal .ml { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
.figurina .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--navy); }
.roles { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.role { display: inline-grid; place-items: center; min-width: 32px; height: 25px; padding: 0 6px; border-radius: 7px; font-family: var(--display); font-weight: 900; font-size: 16px; color: #fff; letter-spacing: 0.02em; }
.role.g-por { background: var(--r-por); } .role.g-dif { background: var(--r-dif); } .role.g-cen { background: var(--r-cen); } .role.g-tre { background: var(--r-tre); } .role.g-att { background: var(--r-att); }
.figurina.enter { animation: deal 560ms cubic-bezier(.2, .9, .25, 1.15) both; }
@keyframes deal { from { transform: translateY(-34px) rotate(-9deg) scale(0.92); opacity: 0; } to { transform: rotate(-1.4deg); opacity: 1; } }

/* ---------- il cronometro del tabellone ---------- */
.clock { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; background: var(--navy); border: 3px solid var(--navy-2); border-radius: 14px; padding: 8px 16px; box-shadow: 0 5px 0 var(--navy-3); }
.clock .secs { font-size: 50px; width: 2.1ch; text-align: right; }
.clock .bar { height: 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.clock .bar i { display: block; height: 100%; width: 100%; background: var(--sun); border-radius: inherit; transform-origin: left; }
.clock.hot { border-color: var(--red); }
.clock.hot .secs { color: #ff5a67; text-shadow: 0 0 12px rgba(239, 43, 60, 0.6); }
.clock.hot .bar i { background: var(--red); }

/* ---------- la busta (offerta) ---------- */
.envelope {
  position: relative; background: var(--manila); color: var(--manila-ink); border-radius: 14px; padding: 24px 14px 14px;
  background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.25), transparent 45%), repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.022) 0 2px, transparent 2px 5px);
  box-shadow: 0 6px 0 #b98e3d, 0 16px 28px rgba(6, 16, 46, 0.25);
  display: flex; flex-direction: column; gap: 12px;
}
.envelope::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 20px; border-radius: 14px 14px 0 0; background: linear-gradient(170deg, rgba(74, 52, 16, 0.16) 49.5%, transparent 50%) left / 50% 100% no-repeat, linear-gradient(190deg, rgba(74, 52, 16, 0.16) 49.5%, transparent 50%) right / 50% 100% no-repeat; }
.envelope .elabel { font-size: 14px; font-weight: 800; }
.amount { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; }
.amount button { min-height: 58px; border-radius: 12px; border: 2px solid var(--manila-ink); background: rgba(255, 255, 255, 0.45); font-size: 28px; font-weight: 800; color: var(--manila-ink); box-shadow: 0 3px 0 var(--manila-ink); }
.amount button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--manila-ink); }
.amount .inwrap { position: relative; }
.amount input { width: 100%; text-align: center; font-family: var(--display); font-weight: 900; font-size: 48px; line-height: 1; padding: 4px 34px 4px 8px; border-radius: 12px; border: 2px solid var(--manila-ink); background: #fffaf0; color: var(--manila-ink); font-variant-numeric: tabular-nums; min-height: 58px; }
.amount input:focus { outline: 3px solid var(--navy); outline-offset: 1px; }
.amount .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-weight: 800; font-size: 15px; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.presets button { min-height: 42px; border-radius: 10px; border: 1.5px solid rgba(74, 52, 16, 0.4); background: rgba(255, 255, 255, 0.4); font-weight: 800; color: var(--manila-ink); font-variant-numeric: tabular-nums; }
.presets button:disabled { opacity: 0.35; }
.envelope .actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.btn.seal { background: var(--red); color: #fff; border-color: var(--red-2); font-size: 17px; box-shadow: 0 4px 0 var(--red-2); }
.btn.pass { background: transparent; color: var(--manila-ink); border-color: var(--manila-ink); box-shadow: none; }
.sealed { display: flex; align-items: center; gap: 14px; }
.waxseal { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff6b72, var(--red) 55%, var(--red-2)); display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 900; font-size: 21px; box-shadow: 0 3px 0 rgba(74, 52, 16, 0.4); flex: none; }
.sealed.enter .waxseal { animation: stamp 380ms cubic-bezier(.3, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: scale(1.8) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
.note { border-radius: 14px; padding: 14px; background: rgba(255, 255, 255, 0.94); color: var(--navy); border: 2px dashed #9eacd2; }
.note.pause { display: flex; flex-direction: column; gap: 10px; border-style: solid; border-color: var(--sun); }

/* ---------- chi ha consegnato la busta ---------- */
.envs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.env { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 7px 10px 7px 7px; border-radius: 12px; background: rgba(255, 255, 255, 0.94); color: var(--navy); font-size: 14px; font-weight: 800; box-shadow: 0 3px 0 var(--grass-deep); }
.env .avatar { width: 30px; height: 30px; font-size: 14px; grid-row: 1 / 3; }
.env .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
.env .st { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.2; }
.env.sent { background: var(--sun); }
.env.sent .st { color: var(--navy); }
.env.off { opacity: 0.55; box-shadow: none; }

/* ---------- buste aperte ---------- */
.reveal { background: #fff; color: var(--navy); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 5px 0 var(--grass-deep); }
.reveal > .tiny { color: var(--muted); font-weight: 700; }
.reveal .verdict { font-family: var(--display); font-weight: 900; font-size: 32px; line-height: 0.98; text-transform: uppercase; }

.bids { display: flex; flex-direction: column; gap: 6px; }

.bidrow:nth-child(2) { animation-delay: 90ms; } .bidrow:nth-child(3) { animation-delay: 180ms; } .bidrow:nth-child(4) { animation-delay: 270ms; } .bidrow:nth-child(n+5) { animation-delay: 340ms; }

.pitch .lines::after { content: ""; position: absolute; left: 50%; bottom: -2.5px; transform: translateX(-50%); width: 40%; height: 15%; border: 2.5px solid rgba(255, 255, 255, 0.75); border-bottom: 0; }
.slot { position: absolute; transform: translate(-50%, -50%); width: 25%; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }

/* ---------- squadre ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tabs button { flex: none; border: 2px solid var(--line); background: #fff; color: var(--navy); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; white-space: nowrap; }

/* ---------- la cronaca, come la striscia delle notizie in tv ---------- */
.ticker { background: var(--navy); color: #fff; box-shadow: 0 5px 0 var(--navy-3); }
.ticker h3 { color: #fff; display: flex; align-items: center; gap: 10px; font-size: 21px; }

.rank { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #fff; color: var(--navy); box-shadow: 0 5px 0 var(--grass-deep); }

.rank .rn { font-weight: 800; font-size: 18px; }
.rank .tot { font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.rank .tot small { font-size: 14px; font-family: var(--body); font-weight: 700; color: var(--muted); margin-left: 3px; }
.rank.p1 { background: var(--sun); box-shadow: 0 5px 0 var(--navy); border: 2px solid var(--navy); }
